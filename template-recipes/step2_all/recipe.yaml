# ----------------------------------------------------------------
# ■ フェーズ2 開発環境のセットアップ
# ----------------------------------------------------------------

phase2:
  packageManagers:
    # --- PowerShell モジュール（PowerShell Gallery） ---
    - managerName: 'psgallery'
      # Windows PowerShell 5.1 は非推奨のため、フェーズ1で入る PowerShell 7 にモジュールを入れる。AutoSetup が 5.1 で動いていても 7 に入るよう、pwsh を呼ぶ。
      checkCommand: 'pwsh -NoProfile -Command "if (-not (Get-Module -ListAvailable -Name ''{package}'')) { exit 1 }"'
      installCommand: 'pwsh -NoProfile -Command "Install-Module -Name ''{package}'' -Scope AllUsers -Repository PSGallery -Force -ErrorAction Stop"'
      packages:
        - description: 'PowerShell の書き方チェック（PSScriptAnalyzer）'
          name: PSScriptAnalyzer

    # --- rustup (ツールチェーン) ---
    - managerName: 'rustup-toolchain'
      checkCommand: "rustup toolchain list | findstr /b /i \"{package}-\""
      installCommand: 'rustup toolchain install {package}'
      packages:
        - description: 'Rust 安定版ツールチェーン'
          name: stable
        - description: 'Rust ナイトリー版ツールチェーン'
          name: nightly
    # --- rustup (コンポーネント / stable) ---
    - managerName: 'rustup-component-stable'
      checkCommand: "rustup component list --installed --toolchain stable | findstr /b /i \"{package}\""
      installCommand: 'rustup component add {package} --toolchain stable'
      packages:
        - description: 'コード整形（rustfmt）'
          name: rustfmt
        - description: '静的解析（clippy）'
          name: clippy
        - description: '標準ライブラリのソース'
          name: rust-src
        - description: 'LLVM ツール群（カバレッジなど）'
          name: llvm-tools
    # --- rustup (コンポーネント / nightly：Miri) ---
    - managerName: 'rustup-component-nightly'
      checkCommand: "rustup component list --installed --toolchain nightly | findstr /b /i \"{package}\""
      installCommand: 'rustup component add {package} --toolchain nightly'
      packages:
        - description: '未定義動作の検査（Miri 本体）'
          name: miri
        - description: '標準ライブラリのソース（Miri 用）'
          name: rust-src
    # --- rustup (ターゲット追加 / cross & WASM) ---
    - managerName: 'rustup-target'
      # 1行に名前だけが出るので、行全体で比べる。先頭だけで比べると、wasm32-wasip1-threads を wasm32-wasip1 と取り違えるため。
      # findstr /x は使わない。rustup の改行は LF だけで、PowerShell 7 はそのまま findstr に渡すため、/x が一致しない。
      checkCommand: 'if (-not (rustup target list --installed | Where-Object { $_ -eq ''{package}'' })) { throw ''未インストール'' }'
      installCommand: 'rustup target add {package}'
      packages:
        - description: 'WebAssembly 向けビルド（ブラウザー用）'
          name: wasm32-unknown-unknown
        - description: 'WebAssembly 向けビルド（WASI。サーバー用）'
          name: wasm32-wasip1
        - description: 'Linux 向けクロスビルド'
          name: x86_64-unknown-linux-gnu
        - description: 'AArch64 Linux 向けクロスビルド（ARMv8、64 ビット版 Raspberry Pi など）'
          name: aarch64-unknown-linux-gnu
        - description: 'ARMv7 Linux 向けクロスビルド（Raspberry Pi など）'
          name: armv7-unknown-linux-gnueabihf
        - description: 'Windows 向けクロスビルド（GNU）'
          name: x86_64-pc-windows-gnu
        - description: 'macOS 向けクロスビルド（Intel Mac）'
          name: x86_64-apple-darwin
        - description: 'macOS 向けクロスビルド（Apple Silicon）'
          name: aarch64-apple-darwin
        - description: 'Android ARMv7 向けクロスビルド'
          name: armv7-linux-androideabi
        - description: 'Android AArch64 向けクロスビルド'
          name: aarch64-linux-android

    # --- npm (グローバルNode.jsパッケージ) ---
    - managerName: 'npm'
      # 直接入れたものだけを見る。--depth=0 が無いと、ほかのパッケージの依存に入っているだけのものも「入っている」と判定してしまうため。
      checkCommand: 'npm list -g --depth=0 {package}'
      installCommand: 'npm install -g {package}'
      packages:
        # [npm 本体]
        - description: 'npm を新しい版に上げる（Node.js に同梱の版より新しい版を使う）'
          name: npm
        # [コマンドで使うツール]
        - description: 'package.json の依存の新しい版を調べる（npm-check-updates）'
          name: npm-check-updates
        - description: 'フォルダーをそのまま Web で見せる簡易サーバー（http-server）'
          name: http-server

    # --- pip（Python のツール） ---
    - managerName: 'pip'
      # 入れるときと同じ uv で確かめる。pip を使うと、PATH の並びによっては別の Python を見てしまうため。
      checkCommand: 'uv pip show {package} --system'
      installCommand: 'uv pip install {package} --system'
      packages:
        # [コマンドで使うツール：どのプロジェクトでも使う]
        - description: 'Python の書き方チェックと整形（Ruff）'
          name: ruff
        - description: 'Python の型チェック（mypy）'
          name: mypy
        - description: 'テストの実行（pytest）'
          name: pytest
        - description: 'テストで実行された行の計測（カバレッジ）'
          name: coverage
        # [スクリプトで使うライブラリ]
        - description: 'Python スクリプトの出力を見やすくするライブラリ（rich）'
          name: rich
        # Web・データ分析・機械学習用のパッケージは、プロジェクトごとに入れる（環境を再現しやすくするため）

    # --- go（Go のツール） ---
    - managerName: 'go'
      # {package} の末尾（@ より前）と同じ名前のコマンドがあれば、入っているとみなす。例：…/cmd/dlv@latest → dlv
      checkCommand: 'if (-not (Get-Command ((''{package}''.Split(''/'')[-1]).Split(''@'')[0]) -ErrorAction SilentlyContinue)) { throw ''未インストール'' }'
      installCommand: 'go install {package}'
      packages:
        - description: 'Go の入力補完やエラー表示（gopls。VS Code の Go 拡張が使う）'
          name: golang.org/x/tools/gopls@latest
        - description: 'import 文の追加・削除と整形（goimports）'
          name: golang.org/x/tools/cmd/goimports@latest
        - description: 'gofmt より厳しいコード整形（gofumpt）'
          name: mvdan.cc/gofumpt@latest
        - description: 'バグや不要なコードを見つける静的解析（Staticcheck）'
          name: honnef.co/go/tools/cmd/staticcheck@latest
        - description: '依存パッケージの既知の脆弱性を調べる（govulncheck。Go 公式）'
          name: golang.org/x/vuln/cmd/govulncheck@latest
        - description: 'デバッガー（Delve）'
          name: github.com/go-delve/delve/cmd/dlv@latest
        - description: 'テスト用のモック（偽物の部品）の生成（mockgen）'
          name: go.uber.org/mock/mockgen@latest
        - description: '連番の定数に、名前を返すメソッドを作る（stringer）'
          name: golang.org/x/tools/cmd/stringer@latest
        - description: 'テスト関数のひな形を作る（gotests）'
          name: github.com/cweill/gotests/gotests@latest

    # --- ghcup: GHC と開発ツール（cabal・stack・hls） ---
    # name に「ツール名 バージョン」を書き、そのまま ghcup に渡す。バージョンの代わりに recommended（GHCup のおすすめ版）も書ける。
    # --set で、入れたものを既定にする。付けないと、GHC は GHCup の導入時に入った版が既定のまま残り、cabal もそちらでビルドする。
    # latest（最新版）は使わない。新しい版が出るたびに「未インストール」と判定され、入れ直しになるため。
    - managerName: 'ghcup'
      checkCommand: 'ghcup whereis {package}'
      installCommand: 'ghcup install {package} --set'
      packages:
        - description: 'GHC 9.10 系（GHCup のおすすめ版。HLS と hlint が対応している）'
          name: 'ghc 9.10.3'
        - description: 'Cabal（公式ビルドシステム）'
          name: 'cabal recommended'
        - description: 'Stack（プロジェクト管理・ビルドツール）'
          name: 'stack recommended'
        - description: 'Haskell Language Server（言語サーバー）'
          name: 'hls recommended'

    # --- VS Code 拡張機能 ---
    - managerName: 'vscode'
      # 1行に ID が1つずつ出るので、行全体で比べる（大文字・小文字は区別しない）。部分一致だと、ms-toolsai.jupyter を ms-toolsai.jupyter-keymap と取り違えるため。
      checkCommand: 'if (-not (code --list-extensions | Where-Object { $_ -eq ''{package}'' })) { throw ''未インストール'' }'
      installCommand: 'code --install-extension {package}'
      packages:
        # 拡張パックに入っている拡張でも、使うものは1つずつ書く。パックの中身は作者の都合で変わることがあるため。
        # [表示]
        - description: '画面の日本語化'
          name: ms-ceintl.vscode-language-pack-ja
        - description: 'インデントの深さ別の色分け'
          name: oderwat.indent-rainbow
        - description: '全角スペースの強調表示'
          name: mosapride.zenkaku
        - description: 'コメントの種類別の色分け（TODO・注意など）'
          name: aaron-bond.better-comments
        - description: 'エラー・警告を行の横に表示'
          name: usernamehw.errorlens
        # [編集の補助]
        - description: 'EditorConfig（インデントや改行の書式をファイルでそろえる）'
          name: EditorConfig.EditorConfig
        - description: 'ファイル パスの入力補完'
          name: christian-kohler.path-intellisense
        - description: 'TODO コメントの一覧表示'
          name: gruntfuggly.todo-tree
        # [Git / GitHub]
        - description: 'Git の履歴や、行ごとの変更者の表示（GitLens）'
          name: eamodio.gitlens
        - description: 'Git のコミット履歴をグラフで表示'
          name: mhutchie.git-graph
        - description: 'GitHub のプル リクエストと Issue の操作'
          name: GitHub.vscode-pull-request-github
        - description: 'GitHub Actions（CI）のワークフローの編集支援'
          name: github.vscode-github-actions
        # [リモート / コンテナ / 共同編集]
        - description: 'WSL 上のプロジェクトの直接編集'
          name: ms-vscode-remote.remote-wsl
        - description: 'SSH 接続先のプロジェクトの直接編集（Remote - SSH）'
          name: ms-vscode-remote.remote-ssh
        - description: 'コンテナ内のプロジェクトの直接編集（Dev Containers）'
          name: ms-vscode-remote.remote-containers
        - description: 'コンテナの操作（Container Tools。旧 Docker 拡張）'
          name: ms-azuretools.vscode-containers
        - description: '複数人での同時編集（Live Share）'
          name: MS-vsliveshare.vsliveshare
        # [Python]
        - description: 'Python の言語サポート'
          name: ms-python.python
        - description: 'Python の入力補完と型チェック（Pylance）'
          name: ms-python.vscode-pylance
        - description: 'Python の書き方チェックと整形（Ruff）'
          name: charliermarsh.ruff
        - description: 'Jupyter ノートブック'
          name: ms-toolsai.jupyter
        # [C / C++]
        - description: 'C・C++ の言語サポート（拡張パック）'
          name: ms-vscode.cpptools-extension-pack
        - description: 'CMake（C・C++ のビルド設定ツール）との連携'
          name: ms-vscode.cmake-tools
        - description: 'Makefile の編集とビルドの支援'
          name: ms-vscode.makefile-tools
        # [ほかの言語]
        - description: 'Rust の言語サポート（rust-analyzer）'
          name: rust-lang.rust-analyzer
        - description: 'Go の言語サポート'
          name: golang.Go
        - description: 'Haskell の言語サポート'
          name: haskell.haskell
        - description: 'C# の言語サポート'
          name: ms-dotnettools.csharp
        - description: 'Java の言語サポート'
          name: redhat.java
        - description: 'PowerShell の言語サポート'
          name: ms-vscode.powershell
        # [デバッグ / テスト]
        - description: 'Rust・C・C++ のデバッガー（LLDB）'
          name: vadimcn.vscode-lldb
        - description: 'テストで実行された行の表示（カバレッジ）'
          name: ryanluker.vscode-coverage-gutters
        # [シェル / 設定ファイル]
        - description: 'シェルスクリプトの書き方チェック（ShellCheck。Windows 用の本体は拡張に入っている）'
          name: timonwong.shellcheck
        - description: 'YAML の言語サポート'
          name: redhat.vscode-yaml
        - description: 'TOML の言語サポート（Cargo.toml など）'
          name: tamasfe.even-better-toml
        - description: '.env ファイルの色分け表示'
          name: mikestead.dotenv
        # [Markdown / 印刷]
        - description: 'Markdown の編集支援（目次・ショートカットなど）'
          name: yzhang.markdown-all-in-one
        - description: 'Markdown の書き方チェック（markdownlint）'
          name: DavidAnson.vscode-markdownlint
        - description: '印刷（コードや Markdown をブラウザー経由で印刷・PDF 化）'
          name: pdconsec.vscode-print

    # --- cargo (CLIツール / stable) ---
    - managerName: 'cargo-stable'
      checkCommand: "cargo install --list | findstr /b /i /c:\"{package} v\""
      installCommand: 'cargo install --locked {package}'
      packages:
        - description: '依存関係の版の一括更新（cargo-edit の cargo upgrade。cargo add・rm は cargo 本体にある）'
          name: cargo-edit
        - description: '依存関係の更新状況の確認'
          name: cargo-outdated
        - description: '脆弱性の監査（RustSec）'
          name: cargo-audit
        - description: '高速なテスト実行'
          name: cargo-nextest
        - description: 'カバレッジの計測（llvm-cov）'
          name: cargo-llvm-cov
        - description: 'ファイルの変更を監視して、チェックやテストを再実行（bacon。開発が終わった cargo-watch の代わり）'
          name: bacon
    # --- cargo (CLIツール / nightly専用) ---
    - managerName: 'cargo-nightly'
      checkCommand: "cargo +nightly install --list | findstr /b /i /c:\"{package} v\""
      installCommand: 'cargo +nightly install --locked {package}'
      packages:
        - description: '使っていない依存関係の検出（nightly 版が必要）'
          name: cargo-udeps

    # --- cabal: グローバルCLIユーティリティ ---
    # 既定の GHC（上の ghcup で --set したもの）でビルドする。weeder は、調べるプロジェクトと同じ GHC でビルドしたものでないと動かない。
    - managerName: 'cabal-global'
      # PATH ではなく、--installdir で決めた置き場所のファイルで調べる。PATH にある同じ名前の別のツールと取り違えず、PATH の反映前でも判定できるようにするため。
      checkCommand: 'if (-not (Test-Path "$env:APPDATA\cabal\bin\{package}.exe")) { throw ''未インストール'' }'
      installCommand: 'cabal update; cabal install --installdir=$env:APPDATA\cabal\bin --overwrite-policy=always {package}'
      packages:
        - description: 'コード整形（fourmolu）'
          name: fourmolu
        - description: '関数・型の検索（hoogle）'
          name: hoogle
        - description: '使っていないコードの検出（weeder）'
          name: weeder
        - description: '静的解析（hlint）'
          name: hlint
