// ---------------------------------------------------------------------------
// recipe.yaml を読むための小さな YAML パーサー
// ネットにつながらない PC でも使えるよう外部ライブラリは使わず、recipe.yaml で使う書き方
// （キー: 値、- のリスト、引用符、コメント）だけに対応する。対応外の書き方はエラーにする。
// ---------------------------------------------------------------------------
class YamlError extends Error {
  constructor(lineNo, message) {
    super(`${lineNo} 行目: ${message}`);
  }
}

function parseYaml(text) {
  const lines = [];
  let pendingGroup = null;
  text.replace(/^﻿/, '').split(/\r?\n/).forEach((raw, index) => {
    const lineNo = index + 1;
    const trimmed = raw.trim();
    if (trimmed === '' || trimmed === '---') return;
    if (trimmed.startsWith('#')) {
      // 「# [エクスプローラー設定]」のような見出しコメントは、画面のグループ分けに使う。
      const group = trimmed.match(/^#\s*\[(.+)\]\s*$/);
      if (group) pendingGroup = group[1].trim();
      return;
    }
    const leading = raw.match(/^[ \t]*/)[0];
    if (leading.includes('\t')) throw new YamlError(lineNo, 'インデントにタブ文字は使えません。半角スペースにしてください。');
    lines.push({ indent: leading.length, text: trimmed, lineNo, groupMarker: pendingGroup });
    pendingGroup = null;
  });

  let pos = 0;
  const keyPattern = /^([A-Za-z0-9_.-]+):(?:\s+(.*))?$/;
  const isSequenceLine = (line) => line.text === '-' || line.text.startsWith('- ');

  function parseNode(indent) {
    return isSequenceLine(lines[pos]) ? parseSequence(indent) : parseMap(indent);
  }

  function parseSequence(indent) {
    const result = [];
    let group = null;
    while (pos < lines.length) {
      const line = lines[pos];
      if (line.indent < indent || !isSequenceLine(line)) break;
      if (line.indent > indent) throw new YamlError(line.lineNo, 'インデント（行頭の空白）の数がずれています。');
      if (line.groupMarker) group = line.groupMarker;
      const rest = line.text === '-' ? '' : line.text.slice(2).trimStart();
      let item;
      if (rest === '') {
        pos++;
        item = pos < lines.length && lines[pos].indent > indent ? parseNode(lines[pos].indent) : null;
      } else if (keyPattern.test(rest)) {
        // 「- key: value」は、「- 」の後ろの位置から始まる「キー: 値」のまとまりとして読む。
        const innerIndent = indent + (line.text.length - rest.length);
        lines[pos] = { ...line, indent: innerIndent, text: rest, groupMarker: null };
        item = parseMap(innerIndent);
      } else {
        item = parseScalar(rest, line.lineNo);
        pos++;
      }
      if (item && typeof item === 'object' && !Array.isArray(item)) {
        Object.defineProperty(item, '__group', { value: group, enumerable: false });
      }
      result.push(item);
    }
    return result;
  }

  function parseMap(indent) {
    const result = {};
    while (pos < lines.length) {
      const line = lines[pos];
      if (line.indent < indent || isSequenceLine(line)) break;
      if (line.indent > indent) throw new YamlError(line.lineNo, 'インデント（行頭の空白）の数がずれています。');
      const match = line.text.match(keyPattern);
      if (!match) throw new YamlError(line.lineNo, '「キー: 値」の形になっていません。');
      const key = match[1];
      const value = (match[2] || '').trim();
      if (Object.prototype.hasOwnProperty.call(result, key)) throw new YamlError(line.lineNo, `キー「${key}」が2回出てきます。`);
      pos++;
      if (value === '' || value.startsWith('#')) {
        const next = lines[pos];
        if (next && next.indent > indent) {
          result[key] = parseNode(next.indent);
        } else if (next && next.indent === indent && isSequenceLine(next)) {
          // 「key:」の直下に、同じ深さで「- 」が並ぶ書き方にも対応する（recipe.yaml の phase2 で使っている）。
          result[key] = parseSequence(indent);
        } else {
          result[key] = null;
        }
      } else {
        result[key] = parseScalar(value, line.lineNo);
      }
    }
    return result;
  }

  if (lines.length === 0) return null;
  const root = parseNode(lines[0].indent);
  if (pos < lines.length) throw new YamlError(lines[pos].lineNo, 'この行の位置（インデント）が正しくありません。');
  return root;
}

function parseScalar(source, lineNo) {
  const ensureRestIsComment = (rest) => {
    const trimmed = rest.trim();
    if (trimmed !== '' && !trimmed.startsWith('#')) throw new YamlError(lineNo, '引用符を閉じた後ろに、余分な文字があります。');
  };
  if (source.startsWith("'")) {
    let out = '';
    let i = 1;
    for (;;) {
      if (i >= source.length) throw new YamlError(lineNo, "「'」が閉じていません。");
      const c = source[i];
      if (c === "'") {
        if (source[i + 1] === "'") { out += "'"; i += 2; continue; }
        i++;
        break;
      }
      out += c;
      i++;
    }
    ensureRestIsComment(source.slice(i));
    return out;
  }
  if (source.startsWith('"')) {
    const escapes = { '"': '"', '\\': '\\', '/': '/', n: '\n', t: '\t', r: '\r', '0': '\0' };
    let out = '';
    let i = 1;
    for (;;) {
      if (i >= source.length) throw new YamlError(lineNo, '「"」が閉じていません。');
      const c = source[i];
      if (c === '"') { i++; break; }
      if (c === '\\') {
        const e = source[i + 1];
        if (!(e in escapes)) throw new YamlError(lineNo, `「\\${e || ''}」という書き方には対応していません。「\\\\」と書いてください。`);
        out += escapes[e];
        i += 2;
        continue;
      }
      out += c;
      i++;
    }
    ensureRestIsComment(source.slice(i));
    return out;
  }
  if (source === '[]') return [];
  if (source === '{}') return {};
  if (/^[[{]/.test(source)) throw new YamlError(lineNo, '[ ] や { } でまとめる書き方には対応していません。「- 」で1行ずつ書いてください。');
  if (/^[|>]/.test(source)) throw new YamlError(lineNo, '| や > を使う複数行の書き方には対応していません。');
  if (/^[&*!]/.test(source) && !/^\*.*\*$/.test(source)) throw new YamlError(lineNo, '& * ! で始まる値は、引用符で囲んでください。');
  const commentAt = source.search(/\s#/);
  const value = (commentAt >= 0 ? source.slice(0, commentAt) : source).trim();
  if (value === '~' || value === 'null') return null;
  return value;
}

// ---------------------------------------------------------------------------
// 画面の状態
// ---------------------------------------------------------------------------
const state = {
  sections: { windowsSettings: [], wingetInstall: [], appxRemove: [] },
  managers: [],
  activeTab: 'windowsSettings',
  filters: {},
};
const templates = [];

const toText = (value) => (value === null || value === undefined ? '' : String(value));
const isPlainObject = (value) => value !== null && typeof value === 'object' && !Array.isArray(value);
const findItem = (sectionName, keyValue) => state.sections[sectionName].find((item) => item[SECTIONS[sectionName].key] === keyValue);
const findManager = (name) => state.managers.find((manager) => manager.managerName === name);

function sectionItemFrom(sectionName, source, group) {
  const item = { group: group || CUSTOM_GROUP, checked: false, custom: false };
  for (const key of SECTIONS[sectionName].keys) item[key] = toText(source[key]).trim();
  return item;
}
const newManager = (managerName, checkCommand, installCommand, custom) => ({ managerName, checkCommand, installCommand, packages: [], custom });
const newPackage = (name, description, checked, custom) => ({ name, description, checked, custom });

// 書き出す順番は一覧の順番になるため、テンプレートの項目は、そのテンプレートで1つ前にある項目の直後に入れる。
// 末尾に足すと、テンプレートにしかない項目の実行順が、読み込んだときと変わってしまう。
function insertAfter(list, previous, item) {
  list.splice(previous ? list.indexOf(previous) + 1 : list.length, 0, item);
}

// テンプレートやレシピの中身を、選択肢の一覧に足す（同じ項目は1つにまとめる）。
function mergeIntoCatalog(config) {
  for (const sectionName of Object.keys(SECTIONS)) {
    const list = config && isPlainObject(config.phase1) ? config.phase1[sectionName] : null;
    if (!Array.isArray(list)) continue;
    let previous = null;
    for (const source of list) {
      if (!isPlainObject(source)) continue;
      const keyValue = toText(source[SECTIONS[sectionName].key]).trim();
      if (keyValue === '') continue;
      let item = findItem(sectionName, keyValue);
      if (!item) {
        item = sectionItemFrom(sectionName, source, source.__group || NO_GROUP);
        insertAfter(state.sections[sectionName], previous, item);
      }
      previous = item;
    }
  }
  const managers = config && isPlainObject(config.phase2) ? config.phase2.packageManagers : null;
  if (!Array.isArray(managers)) return;
  let previousManager = null;
  for (const source of managers) {
    if (!isPlainObject(source)) continue;
    const name = toText(source.managerName).trim();
    if (name === '') continue;
    let manager = findManager(name);
    if (!manager) {
      manager = newManager(name, toText(source.checkCommand).trim(), toText(source.installCommand).trim(), false);
      insertAfter(state.managers, previousManager, manager);
    }
    previousManager = manager;
    for (const pkg of Array.isArray(source.packages) ? source.packages : []) {
      if (!isPlainObject(pkg)) continue;
      const pkgName = toText(pkg.name).trim();
      if (pkgName === '' || manager.packages.some((p) => p.name === pkgName)) continue;
      manager.packages.push(newPackage(pkgName, toText(pkg.description).trim(), false, false));
    }
  }
}

function unknownKeys(source, allowed) {
  return Object.keys(source).filter((key) => !allowed.includes(key));
}

// レシピを読み込み、その中身どおりにチェックを付け直す。一覧にない項目は追加する。
function applyRecipe(config) {
  const warnings = [];
  if (!isPlainObject(config)) throw new Error('中身が空か、「phase1:」「phase2:」で始まる形になっていません。');
  clearSelection();
  for (const key of unknownKeys(config, ['phase1', 'phase2'])) warnings.push(`ファイルの一番上にある「${key}」は使われないため、読み飛ばしました。`);
  const phase1 = isPlainObject(config.phase1) ? config.phase1 : {};
  for (const key of unknownKeys(phase1, Object.keys(SECTIONS))) warnings.push(`phase1 の「${key}」は使われないため、読み飛ばしました。`);

  for (const sectionName of Object.keys(SECTIONS)) {
    const def = SECTIONS[sectionName];
    const list = phase1[sectionName];
    if (list === null || list === undefined) continue;
    if (!Array.isArray(list)) { warnings.push(`phase1.${sectionName} がリストの形ではないため、読み飛ばしました。`); continue; }
    list.forEach((source, index) => {
      const where = `phase1.${sectionName} の ${index + 1} 番目`;
      if (!isPlainObject(source)) { warnings.push(`${where} が「キー: 値」の形ではないため、読み飛ばしました。`); return; }
      for (const key of unknownKeys(source, def.keys)) warnings.push(`${where} の「${key}」は使われないため、読み飛ばしました。`);
      const keyValue = toText(source[def.key]).trim();
      if (keyValue === '') { warnings.push(`${where} に「${def.key}」がないため、読み飛ばしました。`); return; }
      let item = findItem(sectionName, keyValue);
      if (!item) {
        item = sectionItemFrom(sectionName, source, LOADED_GROUP);
        item.custom = true;
        state.sections[sectionName].push(item);
      } else {
        // 読み込んだレシピの説明やオプションを優先する（書き換えて使っている場合があるため）。
        for (const key of def.keys) if (key !== def.key) item[key] = toText(source[key]).trim();
      }
      item.checked = true;
    });
  }

  const phase2 = isPlainObject(config.phase2) ? config.phase2 : {};
  for (const key of unknownKeys(phase2, ['packageManagers'])) warnings.push(`phase2 の「${key}」は使われないため、読み飛ばしました。`);
  const managers = phase2.packageManagers;
  if (managers !== null && managers !== undefined && !Array.isArray(managers)) {
    warnings.push('phase2.packageManagers がリストの形ではないため、読み飛ばしました。');
  } else if (Array.isArray(managers)) {
    managers.forEach((source, index) => {
      const where = `phase2.packageManagers の ${index + 1} 番目`;
      if (!isPlainObject(source)) { warnings.push(`${where} が「キー: 値」の形ではないため、読み飛ばしました。`); return; }
      for (const key of unknownKeys(source, MANAGER_KEYS)) warnings.push(`${where} の「${key}」は使われないため、読み飛ばしました。`);
      const name = toText(source.managerName).trim();
      const checkCommand = toText(source.checkCommand).trim();
      const installCommand = toText(source.installCommand).trim();
      if (!name || !checkCommand || !installCommand) {
        warnings.push(`${where} に managerName・checkCommand・installCommand のどれかがないため、読み飛ばしました。`);
        return;
      }
      let manager = findManager(name);
      if (!manager) {
        manager = newManager(name, checkCommand, installCommand, true);
        state.managers.push(manager);
      } else {
        manager.checkCommand = checkCommand;
        manager.installCommand = installCommand;
      }
      const packages = source.packages;
      if (packages !== null && packages !== undefined && !Array.isArray(packages)) {
        warnings.push(`${where} の packages がリストの形ではないため、読み飛ばしました。`);
        return;
      }
      (packages || []).forEach((pkg, pkgIndex) => {
        const pkgWhere = `${where} の packages の ${pkgIndex + 1} 番目`;
        if (!isPlainObject(pkg)) { warnings.push(`${pkgWhere} が「キー: 値」の形ではないため、読み飛ばしました。`); return; }
        for (const key of unknownKeys(pkg, PACKAGE_KEYS)) warnings.push(`${pkgWhere} の「${key}」は使われないため、読み飛ばしました。`);
        const pkgName = toText(pkg.name).trim();
        if (!pkgName) { warnings.push(`${pkgWhere} に「name」がないため、読み飛ばしました。`); return; }
        let target = manager.packages.find((p) => p.name === pkgName);
        if (!target) {
          target = newPackage(pkgName, '', false, true);
          manager.packages.push(target);
        }
        target.description = toText(pkg.description).trim();
        target.checked = true;
      });
    });
  }
  return warnings;
}

function setAllChecked(checked) {
  for (const list of Object.values(state.sections)) for (const item of list) item.checked = checked;
  for (const manager of state.managers) for (const pkg of manager.packages) pkg.checked = checked;
}
function clearSelection() { setAllChecked(false); }

function selectedCount(tabId) {
  if (tabId === 'packageManagers') return state.managers.reduce((sum, m) => sum + m.packages.filter((p) => p.checked).length, 0);
  return state.sections[tabId].filter((item) => item.checked).length;
}
function totalCount(tabId) {
  if (tabId === 'packageManagers') return state.managers.reduce((sum, m) => sum + m.packages.length, 0);
  return state.sections[tabId].length;
}
const selectedTotal = () => TABS.reduce((sum, tab) => sum + selectedCount(tab.id), 0);

// ---------------------------------------------------------------------------
// recipe.yaml を書き出す
// ---------------------------------------------------------------------------
// 単一引用符で囲むと、\ や " をそのまま書ける（reg.exe のパスやオプションに多い）。
const quote = (value) => `'${String(value).replace(/'/g, "''")}'`;

function buildYaml() {
  const out = [
    '# ================================================================',
    '# Windows環境 初期設定自動化スクリプト (AutoSetup) 設定ファイル',
    '# レシピ作成アプリ (APP_RecipeBuilder/recipe-builder.html) で作成しました。',
    '# ================================================================',
    '# 実行したくない項目は、行を削除するか行頭に「#」を付けてコメントアウトしてください。',
    'phase1:',
  ];
  for (const sectionName of Object.keys(SECTIONS)) {
    const def = SECTIONS[sectionName];
    const items = state.sections[sectionName].filter((item) => item.checked);
    if (items.length === 0) { out.push(`  ${sectionName}: []`); continue; }
    out.push(`  ${sectionName}:`);
    let lastGroup = null;
    for (const item of items) {
      if (item.group !== lastGroup) {
        if (item.group !== NO_GROUP) out.push(`    # [${item.group}]`);
        lastGroup = item.group;
      }
      const keys = def.keys.filter((key) => item[key] !== '');
      keys.forEach((key, index) => out.push(`${index === 0 ? '    - ' : '      '}${key}: ${quote(item[key])}`));
    }
  }
  out.push('', 'phase2:');
  const managers = state.managers.filter((manager) => manager.packages.some((pkg) => pkg.checked));
  if (managers.length === 0) {
    out.push('  packageManagers: []');
  } else {
    out.push('  packageManagers:');
    for (const manager of managers) {
      out.push(`    - managerName: ${quote(manager.managerName)}`);
      out.push(`      checkCommand: ${quote(manager.checkCommand)}`);
      out.push(`      installCommand: ${quote(manager.installCommand)}`);
      out.push('      packages:');
      for (const pkg of manager.packages.filter((p) => p.checked)) {
        if (pkg.description) {
          out.push(`        - description: ${quote(pkg.description)}`);
          out.push(`          name: ${quote(pkg.name)}`);
        } else {
          out.push(`        - name: ${quote(pkg.name)}`);
        }
      }
    }
  }
  return out.join('\n') + '\n';
}

// ---------------------------------------------------------------------------
// 画面部品
// ---------------------------------------------------------------------------
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === false || value === null || value === undefined) continue;
    if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
    else if (key === 'className') el.className = value;
    else if (key === 'checked') el.checked = value;
    else if (key === 'value') el.value = value;
    else el.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}
const $ = (id) => document.getElementById(id);

const ICONS = {
  search: '<path d="m13.5 13.5-3-3"/><circle cx="7" cy="7" r="4.5"/>',
  plus: '<path d="M8 3v10M3 8h10"/>',
  ok: '<circle cx="10" cy="10" r="7.5"/><path d="m6.5 10 2.5 2.5 4.5-5"/>',
  warn: '<path d="M10 3 2.5 16.5h15z"/><path d="M10 8v4M10 14.5v.01"/>',
  close: '<path d="m4 4 8 8M12 4l-8 8"/>',
  shield: '<path d="M8 1.5 3 3.5v4c0 3 2.2 5.6 5 7 2.8-1.4 5-4 5-7v-4z"/>',
  image: '<rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="5.5" cy="6.5" r="1"/><path d="m2.5 11.5 3.5-3 2.5 2 2-1.5 3 2.5"/>',
};
function icon(name, size) {
  const viewBox = size === 20 ? '0 0 20 20' : '0 0 16 16';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', viewBox);
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.5');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  svg.innerHTML = ICONS[name];
  return svg;
}

// グループ見出しの「すべて選ぶ」チェックボックスと、選択数の表示。
// 押すと children をすべて選ぶ／外し、onToggle で行のチェックボックスを合わせる。
// 行のチェックを変えたときは、返した sync を呼んで、見出しの状態（すべて／一部／なし）と選択数を合わせる。
function groupToggle(children, onToggle, attrs) {
  const count = h('span', { className: 'pill' });
  const parent = h('input', {
    ...attrs,
    type: 'checkbox',
    onchange: (event) => {
      // 一部だけ選ばれているときに押したら、すべて選ぶ（多くのデザインシステムと同じ動き）。
      for (const child of children) child.checked = event.target.checked;
      onToggle();
      sync();
      updateSummary();
    },
  });
  const sync = () => {
    const checked = children.filter((c) => c.checked).length;
    parent.checked = children.length > 0 && checked === children.length;
    parent.indeterminate = checked > 0 && checked < children.length;
    parent.disabled = children.length === 0;
    count.textContent = `${checked}/${children.length}`;
    count.classList.toggle('on', checked > 0);
  };
  sync();
  return { parent, count, sync };
}

// 自分で追加した項目だけに出す「消す」ボタン。list から item を取り除き、画面を描き直す。
function removeButton(label, list, item, rerender) {
  return h('button', {
    type: 'button',
    className: 'btn small subtle danger',
    'aria-label': `${label} を一覧から消す`,
    onclick: () => {
      list.splice(list.indexOf(item), 1);
      rerender();
      updateSummary();
    },
  }, '消す');
}

// 「画面を見る」ボタンと、押すと項目の下に広がる画像。画像は開いたときに初めて読み込む。
function screenshotPreview(shot, figureId) {
  const figure = h('figure', { className: 'shot', id: figureId, hidden: true });
  const button = h('button', {
    type: 'button',
    className: 'btn small subtle shot-toggle',
    'aria-expanded': 'false',
    'aria-controls': figureId,
    onclick: () => {
      const open = figure.hidden;
      figure.hidden = !open;
      button.setAttribute('aria-expanded', String(open));
      button.lastChild.textContent = open ? '画面を閉じる' : '画面を見る';
      if (open && !figure.firstChild) {
        const img = h('img', { alt: `${shot.where} の画面（該当する項目を赤枠で囲んでいます）` });
        const frame = h('div', { className: 'shot-frame' }, img);
        img.addEventListener('load', () => {
          // 同じ画像を複数の項目で使うため、赤枠は画像に描き込まず、項目ごとの位置に重ねる。
          // 位置は画像の大きさに対する割合で指定し、画面の幅に合わせて画像が縮んでもずれないようにする。
          if (!shot.box) return;
          const [x, y, w, hgt] = shot.box;
          const { naturalWidth: nw, naturalHeight: nh } = img;
          frame.append(h('span', {
            className: 'shot-box',
            'aria-hidden': 'true',
            style: `left:${(x / nw) * 100}%;top:${(y / nh) * 100}%;width:${(w / nw) * 100}%;height:${(hgt / nh) * 100}%`,
          }));
        });
        img.addEventListener('error', () => {
          frame.replaceWith(h('p', { className: 'shot-missing' }, `画像（images/${shot.file}）が見つかりません。recipe-builder.html と同じ場所に images フォルダーを置いてください。`));
        });
        // 読み込みの完了を取りこぼさないよう、受け取る準備をしてから読み込みを始める。
        img.src = `images/${shot.file}`;
        figure.append(frame, h('figcaption', null, shot.where, h('span', null, '撮影した PC の画面の例です。お使いの PC とは状態が違う場合があります。')));
      }
    },
  }, icon('image'), '画面を見る');
  return { button, figure };
}

function emptyState(title, text) {
  return h('div', { className: 'card empty-state' }, h('strong', null, title), text);
}

function searchBox(onInput) {
  return h('div', { className: 'search' },
    icon('search'),
    h('input', {
      type: 'search',
      className: 'field',
      placeholder: '名前・ID・コマンドで絞り込み',
      'aria-label': '絞り込み',
      value: state.filters[state.activeTab] || '',
      oninput: (event) => { state.filters[state.activeTab] = event.target.value; onInput(); },
    }));
}

function matchesFilter(text, filter) {
  return filter === '' || text.toLowerCase().includes(filter.toLowerCase());
}

function validateFields(fields, values) {
  for (const field of fields) {
    const value = values[field.name];
    if (field.required && value === '') return `「${field.label}」を入力してください。`;
    if (/[\r\n]/.test(value)) return '改行は入れられません。';
  }
  return '';
}

function formRow(field, input) {
  return h('label', { className: 'form-row' },
    h('span', null, field.label, field.required ? h('span', { className: 'req', 'aria-hidden': 'true' }, '*') : h('span', { className: 'sr-only' }, '（任意）')),
    input);
}

// ---------------------------------------------------------------------------
// タブとプレビュー
// ---------------------------------------------------------------------------
const tabButtons = {};

function buildTabs() {
  const list = $('tabs');
  for (const tab of TABS) {
    const pill = h('span', { className: 'pill' });
    const button = h('button', {
      type: 'button',
      role: 'tab',
      className: 'tab',
      id: `tab-${tab.id}`,
      'data-tab': tab.id,
      'aria-controls': 'tab-body',
      onclick: () => selectTab(tab.id),
      onkeydown: (event) => {
        // タブの並びは左右キーで移動できるようにする（WAI-ARIA のタブの操作方法）。
        const index = TABS.findIndex((t) => t.id === tab.id);
        let next = null;
        if (event.key === 'ArrowRight') next = TABS[(index + 1) % TABS.length];
        if (event.key === 'ArrowLeft') next = TABS[(index - 1 + TABS.length) % TABS.length];
        if (event.key === 'Home') next = TABS[0];
        if (event.key === 'End') next = TABS[TABS.length - 1];
        if (!next) return;
        event.preventDefault();
        selectTab(next.id);
        tabButtons[next.id].button.focus();
      },
    }, tab.label, pill);
    tabButtons[tab.id] = { button, pill };
    list.append(button);
  }
}

function selectTab(tabId) {
  state.activeTab = tabId;
  renderTabBody();
  // 狭い画面ではタブが横にはみ出すため、選んだタブが見える位置まで動かす。
  tabButtons[tabId].button.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function updateTabs() {
  for (const tab of TABS) {
    const { button, pill } = tabButtons[tab.id];
    const selected = state.activeTab === tab.id;
    button.setAttribute('aria-selected', String(selected));
    button.tabIndex = selected ? 0 : -1;
    pill.textContent = `${selectedCount(tab.id)}/${totalCount(tab.id)}`;
    pill.classList.toggle('on', selectedCount(tab.id) > 0);
  }
  $('tab-body').setAttribute('aria-labelledby', `tab-${state.activeTab}`);
}

function renderYaml(text) {
  const pre = $('yaml-output');
  const rows = text.replace(/\n$/, '').split('\n').map((line) => {
    const row = h('span', { className: 'ln' });
    const comment = line.match(/^(\s*)(#.*)$/);
    const pair = line.match(/^(\s*)(- )?([A-Za-z0-9_]+)(:)(\s*)(.*)$/);
    if (comment) {
      row.append(comment[1], h('span', { className: 'c' }, comment[2]));
    } else if (pair) {
      row.append(pair[1], pair[2] || '', h('span', { className: 'k' }, pair[3]), pair[4], pair[5]);
      if (pair[6]) row.append(pair[6] === '[]' ? pair[6] : h('span', { className: 's' }, pair[6]));
    } else {
      row.append(line);
    }
    return row;
  });
  pre.replaceChildren(...rows);
}

function updateSummary() {
  updateTabs();
  const total = selectedTotal();
  $('selection-total').replaceChildren(h('strong', null, String(total)), ' 項目を選択中');
  $('preview-summary').textContent = TABS.map((tab) => `${tab.label} ${selectedCount(tab.id)}`).join('・');
  renderYaml(buildYaml());
}

// ---------------------------------------------------------------------------
// Windows 設定・アプリ・削除するアプリ のタブ
// ---------------------------------------------------------------------------
function renderSectionTab(sectionName) {
  const def = SECTIONS[sectionName];
  const listHost = h('div');
  const visibleItems = () => {
    const filter = (state.filters[sectionName] || '').trim();
    return state.sections[sectionName].filter((item) => matchesFilter(`${item.description} ${def.detail(item)} ${item.group}`, filter));
  };
  const setVisible = (checked) => { for (const item of visibleItems()) item.checked = checked; renderList(); updateSummary(); };

  function renderList() {
    const items = visibleItems();
    if (items.length === 0) {
      listHost.replaceChildren(emptyState('当てはまる項目がありません', '絞り込みの言葉を変えるか、下から項目を追加してください。'));
      return;
    }
    const groups = new Map();
    for (const item of items) {
      if (!groups.has(item.group)) groups.set(item.group, []);
      groups.get(item.group).push(item);
    }
    listHost.replaceChildren(...[...groups].map(([group, groupItems], groupIndex) => {
      const boxes = [];
      const headId = `group-${sectionName}-${groupIndex}`;
      const { parent, count, sync } = groupToggle(
        groupItems,
        () => boxes.forEach((box, i) => { box.checked = groupItems[i].checked; }),
        { id: headId, 'aria-label': `${group} をすべて選ぶ` });
      const rows = groupItems.map((item) => {
        const id = `item-${sectionName}-${state.sections[sectionName].indexOf(item)}`;
        const box = h('input', { type: 'checkbox', id, checked: item.checked, onchange: (event) => { item.checked = event.target.checked; sync(); updateSummary(); } });
        boxes.push(box);
        const title = item.description || def.detail(item);
        const shot = sectionName === 'windowsSettings' ? screenshotFor(item) : null;
        const preview = shot ? screenshotPreview(shot, `${id}-shot`) : null;
        return h('div', { className: 'item' },
          box,
          h('label', { for: id, title: def.detail(item) },
            h('span', { className: 'name' }, title, item.custom ? h('span', { className: 'tag' }, '追加') : null),
            h('span', { className: 'detail' }, def.detail(item))),
          preview ? preview.button : null,
          preview ? preview.figure : null,
          item.custom ? removeButton(title, state.sections[sectionName], item, renderList) : null);
      });
      return h('section', { className: 'card group' },
        h('div', { className: 'group-head' },
          parent,
          h('h3', null, h('label', { for: headId }, group)),
          count),
        h('div', { className: `items${def.singleColumn ? ' single' : ''}` }, rows));
    }));
  }

  const error = h('p', { className: 'form-error', role: 'alert' });
  const inputs = {};
  const form = h('form', {
    className: 'form',
    novalidate: true,
    onsubmit: (event) => {
      event.preventDefault();
      const values = {};
      for (const field of def.fields) values[field.name] = inputs[field.name].value.trim();
      const problem = validateFields(def.fields, values);
      if (problem) { error.textContent = problem; return; }
      if (findItem(sectionName, values[def.key])) { error.textContent = '同じ項目が、すでに一覧にあります。'; return; }
      const item = sectionItemFrom(sectionName, values, CUSTOM_GROUP);
      item.custom = true;
      item.checked = true;
      state.sections[sectionName].push(item);
      for (const field of def.fields) inputs[field.name].value = '';
      error.textContent = '';
      renderList();
      updateSummary();
      toast('ok', '一覧に追加して、チェックを付けました。');
      inputs[def.fields[0].name].focus();
    },
  },
  def.fields.map((field) => {
    inputs[field.name] = h('input', { type: 'text', className: `field${field.mono ? ' mono' : ''}`, placeholder: field.placeholder, 'aria-required': field.required ? 'true' : null });
    return formRow(field, inputs[field.name]);
  }),
  h('p', { className: 'form-note' }, icon('shield'), def.note),
  error,
  h('div', { className: 'form-actions' }, h('button', { type: 'submit', className: 'btn primary' }, '追加する')));

  renderList();
  return [
    h('p', { className: 'tab-lead' }, def.lead),
    h('div', { className: 'list-tools' },
      searchBox(renderList),
      h('button', { type: 'button', className: 'btn', onclick: () => setVisible(true) }, '表示中をすべて選ぶ'),
      h('button', { type: 'button', className: 'btn', onclick: () => setVisible(false) }, 'すべて外す')),
    listHost,
    h('details', { className: 'card add-card' }, h('summary', null, icon('plus'), '一覧にない項目を追加する'), form),
  ];
}

// ---------------------------------------------------------------------------
// 開発パッケージのタブ
// ---------------------------------------------------------------------------
function renderManagersTab() {
  const listHost = h('div');

  function renderList() {
    const filter = (state.filters.packageManagers || '').trim();
    const cards = [];
    state.managers.forEach((manager, managerIndex) => {
      const managerMatches = matchesFilter(`${manager.managerName} ${manager.checkCommand} ${manager.installCommand}`, filter);
      const packages = manager.packages.filter((pkg) => managerMatches || matchesFilter(`${pkg.name} ${pkg.description}`, filter));
      if (!managerMatches && packages.length === 0) return;

      const boxes = [];
      const headId = `manager-${managerIndex}`;
      const { parent, count, sync } = groupToggle(
        manager.packages,
        () => boxes.forEach(({ box, pkg }) => { box.checked = pkg.checked; }),
        { id: headId, 'aria-label': `${manager.managerName} のパッケージをすべて選ぶ` });

      const rows = packages.map((pkg) => {
        const id = `pkg-${managerIndex}-${manager.packages.indexOf(pkg)}`;
        const box = h('input', { type: 'checkbox', id, checked: pkg.checked, onchange: (event) => { pkg.checked = event.target.checked; sync(); updateSummary(); } });
        boxes.push({ box, pkg });
        return h('div', { className: 'item' },
          box,
          h('label', { for: id, title: pkg.name },
            h('span', { className: 'name' }, pkg.description || pkg.name, pkg.custom ? h('span', { className: 'tag' }, '追加') : null),
            h('span', { className: 'detail' }, pkg.name)),
          pkg.custom ? removeButton(pkg.name, manager.packages, pkg, renderList) : null);
      });

      const pkgName = h('input', { type: 'text', className: 'field mono', placeholder: 'パッケージ名', 'aria-label': `${manager.managerName} に追加するパッケージ名` });
      const pkgDesc = h('input', { type: 'text', className: 'field', placeholder: '説明（任意）', 'aria-label': `${manager.managerName} に追加するパッケージの説明` });
      const pkgError = h('p', { className: 'form-error', role: 'alert' });

      cards.push(h('section', { className: 'card group' },
        h('div', { className: 'group-head' },
          parent,
          h('div', { className: 'titles' },
            h('h3', null, h('label', { for: headId }, manager.managerName), manager.custom ? h('span', { className: 'tag' }, '追加') : null),
            h('span', { className: 'sub', title: manager.installCommand }, manager.installCommand)),
          count,
          manager.custom ? removeButton(manager.managerName, state.managers, manager, renderList) : null),
        rows.length ? h('div', { className: 'items' }, rows) : h('p', { className: 'empty-state' }, 'パッケージがありません。下から追加してください。'),
        h('form', {
          className: 'inline-add',
          novalidate: true,
          onsubmit: (event) => {
            event.preventDefault();
            const values = { name: pkgName.value.trim(), description: pkgDesc.value.trim() };
            const problem = validateFields([{ name: 'name', label: 'パッケージ名', required: true }, { name: 'description', label: '説明' }], values);
            if (problem) { pkgError.textContent = problem; return; }
            if (manager.packages.some((p) => p.name === values.name)) { pkgError.textContent = '同じパッケージが、すでにあります。'; return; }
            manager.packages.push(newPackage(values.name, values.description, true, true));
            renderList();
            updateSummary();
            toast('ok', `${manager.managerName} に ${values.name} を追加しました。`);
          },
        }, pkgName, pkgDesc, h('button', { type: 'submit', className: 'btn' }, icon('plus'), 'パッケージを追加'), pkgError)));
    });
    listHost.replaceChildren(...(cards.length ? cards : [emptyState('当てはまる項目がありません', '絞り込みの言葉を変えてください。')]));
  }

  const managerFields = [
    { name: 'managerName', label: '名前', required: true, placeholder: '例: npm' },
    { name: 'checkCommand', label: '入っているか確かめるコマンド（{package} がパッケージ名に置き換わります）', required: true, mono: true, placeholder: '例: npm list -g {package} --depth=0' },
    { name: 'installCommand', label: '入れるコマンド', required: true, mono: true, placeholder: '例: npm install -g {package}' },
  ];
  const inputs = {};
  const error = h('p', { className: 'form-error', role: 'alert' });
  const form = h('form', {
    className: 'form',
    novalidate: true,
    onsubmit: (event) => {
      event.preventDefault();
      const values = {};
      for (const field of managerFields) values[field.name] = inputs[field.name].value.trim();
      let problem = validateFields(managerFields, values);
      if (!problem && (!values.checkCommand.includes('{package}') || !values.installCommand.includes('{package}'))) {
        problem = '確かめるコマンドと入れるコマンドには、どちらも {package} を入れてください。';
      }
      if (!problem && findManager(values.managerName)) problem = '同じ名前が、すでにあります。';
      if (problem) { error.textContent = problem; return; }
      state.managers.push(newManager(values.managerName, values.checkCommand, values.installCommand, true));
      for (const field of managerFields) inputs[field.name].value = '';
      error.textContent = '';
      renderList();
      updateSummary();
      toast('ok', `${values.managerName} を追加しました。続けて、パッケージを追加してください。`);
    },
  },
  managerFields.map((field) => {
    inputs[field.name] = h('input', { type: 'text', className: `field${field.mono ? ' mono' : ''}`, placeholder: field.placeholder, 'aria-required': 'true' });
    return formRow(field, inputs[field.name]);
  }),
  h('p', { className: 'form-note' }, icon('shield'), 'パッケージを1つ以上選んだものだけが recipe.yaml に入ります。コマンドは、そのまま PowerShell で実行されます。'),
  error,
  h('div', { className: 'form-actions' }, h('button', { type: 'submit', className: 'btn primary' }, '追加する')));

  renderList();
  return [
    h('p', { className: 'tab-lead' }, '再起動後のフェーズ2で、npm や pip などを使って入れる開発用パッケージです。'),
    h('div', { className: 'list-tools' }, searchBox(renderList)),
    listHost,
    h('details', { className: 'card add-card' }, h('summary', null, icon('plus'), 'パッケージマネージャーを追加する'), form),
  ];
}

function renderTabBody() {
  $('tab-body').dataset.tab = state.activeTab;
  $('tab-body').replaceChildren(...(state.activeTab === 'packageManagers' ? renderManagersTab() : renderSectionTab(state.activeTab)));
  updateSummary();
}

// ---------------------------------------------------------------------------
// 通知と「元に戻す」
// ---------------------------------------------------------------------------
// action を渡すと、通知の中にボタンを出す（例: 元に戻す）。
function toast(kind, title, details, action) {
  const box = h('div', { className: `toast ${kind}`, role: kind === 'warn' ? 'alert' : 'status' },
    icon(kind === 'ok' ? 'ok' : 'warn', 20),
    h('div', { className: 'body' },
      h('p', { className: 'title' }, title),
      details && details.length ? h('ul', null, details.map((d) => h('li', null, d))) : null,
      action ? h('button', { type: 'button', className: 'btn small action', onclick: () => { box.remove(); action.run(); } }, action.label) : null),
    h('button', { type: 'button', className: 'btn small subtle close', 'aria-label': '通知を閉じる', onclick: () => box.remove() }, icon('close')));
  $('toasts').append(box);
  // 問題の一覧がある通知は読み終わるまで残し、ただの完了通知だけ自動で消す。
  // 「元に戻す」が付いた通知は、押す時間を残すため長めに表示する。
  if (kind === 'ok') setTimeout(() => box.remove(), action ? 10000 : 4000);
}

// 確認画面で操作を止める代わりに、置き換える前の状態を覚えておき、通知から戻せるようにする。
function takeSnapshot() {
  return selectedTotal() === 0 ? null : JSON.stringify({ sections: state.sections, managers: state.managers });
}
function undoAction(snapshot) {
  if (!snapshot) return undefined;
  return {
    label: '元に戻す',
    run: () => {
      const saved = JSON.parse(snapshot);
      state.sections = saved.sections;
      state.managers = saved.managers;
      renderTabBody();
      toast('ok', '前の選択に戻しました。');
    },
  };
}

// ---------------------------------------------------------------------------
// ボタンの動き
// ---------------------------------------------------------------------------
$('apply-template').addEventListener('click', () => {
  const template = templates[Number($('template-select').value)];
  if (!template) return;
  const undo = undoAction(takeSnapshot());
  const warnings = applyRecipe(template.config);
  renderTabBody();
  if (warnings.length) toast('warn', `テンプレート「${template.name}」に、確認が必要な点があります。`, warnings, undo);
  else toast('ok', `テンプレート「${template.name}」の内容でチェックを付けました。`, null, undo);
});

$('load-file').addEventListener('click', () => $('file-input').click());
$('file-input').addEventListener('change', (event) => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let config;
    try {
      config = parseYaml(String(reader.result));
      if (!isPlainObject(config)) throw new Error('中身が空か、「phase1:」「phase2:」で始まる形になっていません。');
    } catch (error) {
      toast('warn', `「${file.name}」を読み込めませんでした。`, [error.message]);
      return;
    }
    const undo = undoAction(takeSnapshot());
    const warnings = applyRecipe(config);
    renderTabBody();
    if (warnings.length) toast('warn', `「${file.name}」を読み込みました。次の点を確認してください。`, warnings, undo);
    else toast('ok', `「${file.name}」を読み込みました。`, null, undo);
  };
  reader.onerror = () => toast('warn', `「${file.name}」を読み込めませんでした。`);
  reader.readAsText(file, 'utf-8');
});

$('select-all').addEventListener('click', () => {
  const undo = undoAction(takeSnapshot());
  setAllChecked(true);
  renderTabBody();
  toast('ok', 'すべてのタブの項目にチェックを付けました。', null, undo);
});

$('clear-all').addEventListener('click', () => {
  const undo = undoAction(takeSnapshot());
  if (!undo) return;
  clearSelection();
  renderTabBody();
  toast('ok', 'すべてのタブのチェックを外しました。', null, undo);
});

$('copy-yaml').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(buildYaml());
    toast('ok', 'recipe.yaml の内容をコピーしました。');
  } catch {
    // file:// で開いたときなど、クリップボードが使えないブラウザーがあるため、選択状態にして手でコピーしてもらう。
    const range = document.createRange();
    range.selectNodeContents($('yaml-output'));
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    toast('warn', '自動でコピーできなかったため、内容を選択しました。Ctrl + C でコピーしてください。');
  }
});

$('download-yaml').addEventListener('click', () => {
  if (selectedTotal() === 0) {
    toast('warn', 'まだ何も選ばれていません。', ['項目にチェックを付けるか、テンプレートから始めてください。']);
    return;
  }
  const blob = new Blob([buildYaml()], { type: 'text/yaml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = h('a', { href: url, download: 'recipe.yaml' });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('ok', 'recipe.yaml を保存しました。AutoSetup.ps1 と同じフォルダーに置いて使ってください。');
});

// ---------------------------------------------------------------------------
// 起動
// ---------------------------------------------------------------------------
(function start() {
  const templateErrors = [];
  for (const el of document.querySelectorAll('script.recipe-template')) {
    try {
      const config = parseYaml(el.textContent);
      templates.push({ name: el.dataset.name, config });
      mergeIntoCatalog(config);
    } catch (error) {
      templateErrors.push(`${el.dataset.path}: ${error.message}`);
    }
  }
  $('template-select').replaceChildren(...templates.map((template, index) => h('option', { value: String(index) }, template.name)));
  // 開いたときは、いちばん少ない基本のテンプレートから始め、必要なものを足していく形にする。見つからなければ先頭を使う。
  const defaultIndex = Math.max(0, templates.findIndex((template) => template.name === DEFAULT_TEMPLATE));
  if (templates.length > 0) {
    $('template-select').value = String(defaultIndex);
    applyRecipe(templates[defaultIndex].config);
  }
  buildTabs();
  renderTabBody();
  if (templates.length === 0) {
    toast('warn', 'テンプレートが埋め込まれていません。APP_RecipeBuilder/Update-RecipeBuilder.ps1 を実行してください。', templateErrors);
  } else if (templateErrors.length > 0) {
    toast('warn', '読み込めなかったテンプレートがあります。', templateErrors);
  }
})();
</script>
</body>
</html>
