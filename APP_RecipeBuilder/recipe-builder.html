<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レシピ作成アプリ</title>
<script>
// 描画前にテーマを決めておかないと、保存したテーマと OS の設定が違うときに一瞬だけ逆の色で表示される。
try {
  const savedTheme = localStorage.getItem('recipe-builder-theme');
  if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
} catch (e) { /* file:// やプライベートモードで保存領域が使えなくても、OS の設定どおりに表示できる */ }
</script>
<style>
/* 色・余白は Microsoft の Fluent 2 デザインの考え方（4px 単位の余白、中立色＋ブランド色）にそろえている。 */
:root {
  --bg: #f5f5f5;
  --surface: #ffffff;
  --surface-sunken: #fafafa;
  --hover: #f0f0f0;
  --border: #e0e0e0;
  --border-strong: #c7c7c7;
  --text: #242424;
  --muted: #616161;
  --subtle: #8a8a8a;
  --brand-fill: #0f6cbd;
  --brand-fill-hover: #115ea3;
  --on-brand: #ffffff;
  --brand-fg: #0f6cbd;
  --brand-soft: #ebf3fc;
  --danger: #c50f1f;
  --danger-soft: #fdf3f4;
  --success: #107c10;
  --warn-bg: #fff9f5;
  --warn-border: #f4bfab;
  --warn-text: #8a3707;
  --code-key: #0f6cbd;
  --code-string: #8a3707;
  --code-comment: #6e6e6e;
  /* タブごとの色。どの種類の項目を見ているか、色で分かるようにする。 */
  --c-settings: #0f6cbd;
  --c-settings-soft: #ebf3fc;
  --c-apps: #107c10;
  --c-apps-soft: #f1faf1;
  --c-remove: #c50f1f;
  --c-remove-soft: #fdf3f4;
  --c-packages: #6b3fa0;
  --c-packages-soft: #f5f0fb;
  --shadow-2: 0 0 2px rgba(0, 0, 0, .12), 0 1px 2px rgba(0, 0, 0, .14);
  --shadow-16: 0 0 2px rgba(0, 0, 0, .12), 0 8px 16px rgba(0, 0, 0, .14);
  --radius: 4px;
  --radius-lg: 8px;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --sans: "Segoe UI Variable Text", "Segoe UI", "Yu Gothic UI", "Meiryo UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1f1f;
    --surface: #292929;
    --surface-sunken: #242424;
    --hover: #333333;
    --border: #3d3d3d;
    --border-strong: #5c5c5c;
    --text: #ffffff;
    --muted: #d1d1d1;
    --subtle: #adadad;
    --brand-fill: #115ea3;
    --brand-fill-hover: #0f6cbd;
    --on-brand: #ffffff;
    --brand-fg: #62abf5;
    --brand-soft: #082338;
    --danger: #f1707b;
    --danger-soft: #3b1c1f;
    --success: #54b054;
    --warn-bg: #411200;
    --warn-border: #8a3707;
    --warn-text: #faa06b;
    --code-key: #62abf5;
    --code-string: #faa06b;
    --code-comment: #adadad;
    --c-settings: #62abf5;
    --c-settings-soft: #082338;
    --c-apps: #54b054;
    --c-apps-soft: #052505;
    --c-remove: #f1707b;
    --c-remove-soft: #3b1c1f;
    --c-packages: #b9a2f0;
    --c-packages-soft: #2a1f3d;
    --shadow-2: 0 0 2px rgba(0, 0, 0, .24), 0 1px 2px rgba(0, 0, 0, .28);
    --shadow-16: 0 0 2px rgba(0, 0, 0, .24), 0 8px 16px rgba(0, 0, 0, .28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1f1f;
  --surface: #292929;
  --surface-sunken: #242424;
  --hover: #333333;
  --border: #3d3d3d;
  --border-strong: #5c5c5c;
  --text: #ffffff;
  --muted: #d1d1d1;
  --subtle: #adadad;
  --brand-fill: #115ea3;
  --brand-fill-hover: #0f6cbd;
  --on-brand: #ffffff;
  --brand-fg: #62abf5;
  --brand-soft: #082338;
  --danger: #f1707b;
  --danger-soft: #3b1c1f;
  --success: #54b054;
  --warn-bg: #411200;
  --warn-border: #8a3707;
  --warn-text: #faa06b;
  --code-key: #62abf5;
  --code-string: #faa06b;
  --code-comment: #adadad;
  --c-settings: #62abf5;
  --c-settings-soft: #082338;
  --c-apps: #54b054;
  --c-apps-soft: #052505;
  --c-remove: #f1707b;
  --c-remove-soft: #3b1c1f;
  --c-packages: #b9a2f0;
  --c-packages-soft: #2a1f3d;
  --shadow-2: 0 0 2px rgba(0, 0, 0, .24), 0 1px 2px rgba(0, 0, 0, .28);
  --shadow-16: 0 0 2px rgba(0, 0, 0, .24), 0 8px 16px rgba(0, 0, 0, .28);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/20px var(--sans);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }

/* ---- ボタン・入力欄 ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 32px;
  padding: 5px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font: 600 14px/20px var(--sans);
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand-fill); border-color: transparent; color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-fill-hover); }
.btn.subtle { border-color: transparent; background: transparent; color: var(--muted); font-weight: 400; }
.btn.subtle:hover { background: var(--hover); color: var(--text); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 24px; padding: 1px 8px; font-size: 12px; font-weight: 400; }
.btn svg { width: 16px; height: 16px; flex: none; }
#theme-toggle .icon-sun, :root.is-dark #theme-toggle .icon-moon { display: none; }
:root.is-dark #theme-toggle .icon-sun { display: block; }
.field {
  min-height: 32px;
  padding: 5px 10px;
  border: 1px solid var(--border-strong);
  border-bottom-color: var(--subtle);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font: 14px/20px var(--sans);
  min-width: 0;
}
.field.mono { font-family: var(--mono); font-size: 13px; }
.field::placeholder { color: var(--subtle); }
:focus-visible { outline: 2px solid var(--brand-fg); outline-offset: 2px; }
.field:focus-visible { outline: none; border-bottom: 2px solid var(--brand-fg); padding-bottom: 4px; }
input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--brand-fill); flex: none; cursor: pointer; }

/* ---- 上部のバー ---- */
.appbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.app-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.app-icon {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-lg);
  background: var(--brand-fill);
  color: var(--on-brand);
  flex: none;
}
.app-icon svg { width: 20px; height: 20px; }
.app-title h1 { font-size: 16px; line-height: 22px; font-weight: 600; }
.app-title p { color: var(--muted); font-size: 12px; line-height: 16px; }
.app-actions { display: flex; gap: 8px; align-items: center; }
.selection-total { color: var(--muted); font-size: 12px; margin-right: 4px; white-space: nowrap; }
@media (max-width: 600px) {
  /* 狭い画面では上部のバーが場所を取りすぎないよう、説明文を省いてボタンを横いっぱいに並べる。 */
  .app-title p { display: none; }
  .app-actions { width: 100%; }
  .selection-total { flex: 1; }
  .hide-narrow { display: none; }
}
.selection-total strong { color: var(--text); font-size: 14px; }

/* ---- 出発点を選ぶ帯 ---- */
.startbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 12px 24px;
  background: var(--surface-sunken);
  border-bottom: 1px solid var(--border);
}
.startbar label { font-weight: 600; }
.startbar .hint { color: var(--muted); font-size: 12px; }
.startbar .spacer { flex: 1; }

/* ---- 本体の2列 ---- */
.layout {
  display: grid;
  /* 長いコマンドを折り返さずに読めるよう、プレビューを広めに取る。一覧は、4つのタブが切れずに並ぶ 660px より狭くしない。 */
  grid-template-columns: minmax(660px, 1fr) minmax(560px, 2.5fr);
  gap: 24px;
  padding: 24px;
  max-width: 2400px;
  margin: 0 auto;
  align-items: start;
}
@media (max-width: 1300px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 16px; }
  .appbar, .startbar { padding-left: 16px; padding-right: 16px; }
}

/* ---- タブ ---- */
.tabs { display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; box-shadow: inset 0 -1px 0 var(--border); margin-bottom: 16px; }
.tab {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border: none;
  background: transparent;
  color: var(--muted);
  font: 14px/20px var(--sans);
  cursor: pointer;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); font-weight: 600; }
.tab[aria-selected="true"]::after {
  content: "";
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: var(--brand-fill);
}
.pill {
  display: inline-block;
  min-width: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--hover);
  color: var(--muted);
  font-size: 12px;
  line-height: 18px;
  font-weight: 600;
  text-align: center;
}
.pill.on { background: var(--brand-soft); color: var(--brand-fg); }

/* ---- タブごとの色分け ---- */
[data-tab="windowsSettings"] { --tab-color: var(--c-settings); --tab-soft: var(--c-settings-soft); }
[data-tab="wingetInstall"] { --tab-color: var(--c-apps); --tab-soft: var(--c-apps-soft); }
[data-tab="appxRemove"] { --tab-color: var(--c-remove); --tab-soft: var(--c-remove-soft); }
[data-tab="packageManagers"] { --tab-color: var(--c-packages); --tab-soft: var(--c-packages-soft); }
.tab::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tab-color); flex: none; }
.tab[aria-selected="true"]::after { background: var(--tab-color); }
.tab .pill { background: var(--tab-soft); color: var(--tab-color); }
#tab-body .group { border-top: 3px solid var(--tab-color); }
#tab-body input[type="checkbox"] { accent-color: var(--tab-color); }
#tab-body .pill.on, #tab-body .tag { background: var(--tab-soft); color: var(--tab-color); }
#tab-body .add-card summary svg { color: var(--tab-color); }

/* ---- 一覧の上の道具 ---- */
.list-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.search { position: relative; flex: 1 1 240px; min-width: 0; }
.search svg { position: absolute; left: 10px; top: 8px; width: 16px; height: 16px; color: var(--subtle); pointer-events: none; }
.search .field { width: 100%; padding-left: 34px; }
.tab-lead { color: var(--muted); margin: -4px 0 16px; }

/* ---- グループのカード ---- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-2);
}
.group { margin-bottom: 12px; overflow: hidden; }
.group-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-sunken);
}
.group-head label { cursor: pointer; }
.group-head h3 { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-head .sub { display: block; color: var(--muted); font: 12px/16px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-head .titles { flex: 1; min-width: 0; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); padding: 4px; }
.items.single { grid-template-columns: minmax(0, 1fr); }
.item {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius);
  min-width: 0;
}
.item:hover { background: var(--hover); }
.item input[type="checkbox"] { margin-top: 2px; }
.item label { flex: 1; min-width: 0; cursor: pointer; }
.item .name { display: block; }
.item .detail {
  display: block;
  color: var(--subtle);
  font: 12px/16px var(--mono);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* ---- 画面の画像 ---- */
.shot-toggle { flex: none; }
.shot { flex-basis: 100%; margin: 4px 0 4px 26px; min-width: 0; }
.shot-frame { position: relative; display: inline-block; max-width: min(100%, 720px); vertical-align: top; }
.shot img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-2);
}
/* 赤枠は明るい表示・暗い表示のどちらでも目立つよう、固定の赤に白い縁を付ける。 */
.shot-box {
  position: absolute;
  border: 3px solid #e3000f;
  border-radius: 4px;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .75);
  pointer-events: none;
}
.shot figcaption { margin-top: 6px; font-size: 12px; line-height: 18px; color: var(--muted); }
.shot figcaption span { display: block; color: var(--subtle); }
.shot-missing { color: var(--warn-text); font-size: 12px; }
.tag {
  display: inline-block;
  margin-left: 6px;
  padding: 0 6px;
  border-radius: var(--radius);
  background: var(--brand-soft);
  color: var(--brand-fg);
  font-size: 11px;
  line-height: 16px;
  font-weight: 600;
  vertical-align: 1px;
}
.empty-state { padding: 32px 16px; text-align: center; color: var(--muted); }
.empty-state strong { display: block; color: var(--text); margin-bottom: 4px; }

/* ---- 追加フォーム ---- */
.add-card { margin-top: 16px; }
.add-card summary {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  cursor: pointer;
  font-weight: 600;
  list-style: none;
}
.add-card summary::-webkit-details-marker { display: none; }
.add-card summary svg { width: 16px; height: 16px; color: var(--brand-fg); transition: transform .15s; }
.add-card[open] summary svg { transform: rotate(45deg); }
.form { display: grid; gap: 12px; padding: 0 16px 16px; }
.form-row { display: grid; gap: 4px; }
.form-row > span { font-size: 12px; font-weight: 600; color: var(--muted); }
.form-row .req { color: var(--danger); margin-left: 2px; }
.form-note { display: flex; gap: 8px; color: var(--muted); font-size: 12px; line-height: 16px; }
.form-note svg { width: 16px; height: 16px; flex: none; color: var(--warn-text); }
.form-error { color: var(--danger); font-size: 12px; min-height: 16px; }
.form-actions { display: flex; gap: 8px; }
.inline-add { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 16px 12px; border-top: 1px dashed var(--border); }
.inline-add .field { flex: 1 1 160px; }
.inline-add .form-error { flex-basis: 100%; }

/* ---- プレビュー ---- */
.preview { position: sticky; top: 88px; display: flex; flex-direction: column; max-height: calc(100vh - 112px); overflow: hidden; }
.preview-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.preview-head h2 { font-size: 14px; font-weight: 600; }
.preview-head p { color: var(--muted); font-size: 12px; line-height: 16px; }
.code {
  margin: 0;
  padding: 12px 0;
  overflow: auto;
  flex: 1;
  background: var(--surface-sunken);
  font: 12px/18px var(--mono);
  counter-reset: line;
  tab-size: 2;
}
.code .ln { display: block; padding: 0 16px 0 0; white-space: pre; }
.code .ln::before {
  counter-increment: line;
  content: counter(line);
  display: inline-block;
  width: 40px;
  margin-right: 12px;
  padding-right: 8px;
  text-align: right;
  color: var(--subtle);
  border-right: 1px solid var(--border);
  user-select: none;
}
.code .k { color: var(--code-key); }
.code .s { color: var(--code-string); }
.code .c { color: var(--code-comment); font-style: italic; }
.preview-foot { padding: 10px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; line-height: 16px; }
@media (max-width: 1300px) {
  .preview { position: static; max-height: none; }
  .code { max-height: 60vh; }
}

/* ---- 通知 ---- */
.toasts { position: fixed; right: 24px; bottom: 24px; z-index: 30; display: grid; gap: 8px; width: min(420px, calc(100vw - 32px)); }
@media (max-width: 1300px) { .toasts { right: 16px; bottom: 16px; } }
.toast {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 12px 16px;
  border-radius: var(--radius-lg);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-16);
  animation: toast-in .18s ease-out;
}
.toast svg { width: 20px; height: 20px; flex: none; }
.toast.ok svg { color: var(--success); }
.toast.warn { background: var(--warn-bg); border-color: var(--warn-border); }
.toast.warn svg { color: var(--warn-text); }
.toast .body { flex: 1; min-width: 0; }
.toast .title { font-weight: 600; }
.toast ul { margin: 4px 0 0; padding-left: 18px; max-height: 160px; overflow: auto; font-size: 12px; line-height: 18px; }
.toast .close { margin: -4px -8px 0 0; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .add-card summary svg { transition: none; } }

.toast .action { margin-top: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header class="appbar">
  <div class="app-title">
    <div class="app-icon" aria-hidden="true">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="12" height="15" rx="2"/><path d="M7.5 3V2h5v1"/><path d="m7 10 2 2 4-4"/></svg>
    </div>
    <div>
      <h1>レシピ作成アプリ</h1>
      <p>チェックを付けるだけで、AutoSetup.ps1 用の recipe.yaml を作れます</p>
    </div>
  </div>
  <div class="app-actions">
    <span class="selection-total" id="selection-total" aria-live="polite"></span>
    <button type="button" class="btn subtle" id="theme-toggle">
      <svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>
      <span id="theme-toggle-label"></span>
    </button>
    <button type="button" class="btn" id="load-file">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10v3h12v-3"/><path d="M8 2v8"/><path d="m5 5 3-3 3 3"/></svg>
      <span class="hide-narrow">recipe.yaml を</span>読み込む
    </button>

# ================================================================
# Windows環境 初期設定自動化スクリプト (AutoSetup) 設定ファイル
# ================================================================
# このファイルは、新しいWindows環境の構築を自動化するためのタスクを定義します。
# 実行したくない項目は、行を削除するか行頭に「#」を付けてコメントアウトしてください。

# ----------------------------------------------------------------
# ■ フェーズ1 OSの基本設定と必須アプリケーションの導入
# ----------------------------------------------------------------
phase1:
  # --- Windowsシステム設定 (レジストリ変更) ---
  windowsSettings:
    # [Windows Update]
    - description: 'Windows Update で、ほかの Microsoft 製品（Office など）も更新する'
      command: '(New-Object -ComObject Microsoft.Update.ServiceManager).AddService2(''7971f918-a847-4430-9279-4a52d1efe18d'', 7, '''') | Out-Null'
    # [エクスプローラー設定]
    - description: 'エクスプローラーで隠しファイルを表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v Hidden /t REG_DWORD /d 1 /f'
    - description: 'エクスプローラーで登録されている拡張子を常に表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v HideFileExt /t REG_DWORD /d 0 /f'
    - description: 'アドレスバーに常に完全なパスを表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\CabinetState" /v FullPathAddress /t REG_DWORD /d 1 /f'
    - description: 'エクスプローラー起動時のデフォルト表示を「PC」にする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v LaunchTo /t REG_DWORD /d 1 /f'
    - description: 'エクスプローラーの「ホーム」に最近使ったファイルを表示しない'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer" /v ShowRecent /t REG_DWORD /d 0 /f'
    - description: 'エクスプローラーの「ホーム」によく使うフォルダーを表示しない'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer" /v ShowFrequent /t REG_DWORD /d 0 /f'
    # [自動再生設定]
    - description: '全てのメディアとデバイスで自動再生機能を有効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers" /v DisableAutoplay /t REG_DWORD /d 0 /f'
    - description: 'リムーバブルドライブ接続時、フォルダーを開いてファイルを表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers\UserChosenExecuteHandlers\StorageOnArrival" /ve /t REG_SZ /d "MSOpenFolder" /f'
    # [通知・プライバシー設定]
    - description: 'サインイン時の「ようこそ」画面やヒント表示を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-310093Enabled /t REG_DWORD /d 0 /f'
    - description: 'デバイス設定の完了を促す通知を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\UserProfileEngagement" /v ScoobeSystemSettingEnabled /t REG_DWORD /d 0 /f'
    - description: 'Windowsの使用に関するヒントや提案の通知を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-338389Enabled /t REG_DWORD /d 0 /f'
    - description: 'OSの診断データを必須なものに限定する'
      command: 'reg.exe add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection" /v AllowTelemetry /t REG_DWORD /d 1 /f'
    - description: '手書き・キーボード入力の履歴がMicrosoftに送信されるのを防ぐ'
      command: 'reg.exe add "HKCU\Software\Microsoft\Input\TIPC" /v Enabled /t REG_DWORD /d 0 /f'
    - description: '診断データに基づいた個人向けのおすすめ機能などを無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Privacy" /v TailoredExperiencesWithDiagnosticDataEnabled /t REG_DWORD /d 0 /f'
    - description: 'アクティビティの履歴を記録しない'
      command: 'reg.exe add "HKLM\SOFTWARE\Policies\Microsoft\Windows\System" /v PublishUserActivities /t REG_DWORD /d 0 /f'
    - description: 'アクティビティの履歴を Microsoft に送らない'
      command: 'reg.exe add "HKLM\SOFTWARE\Policies\Microsoft\Windows\System" /v UploadUserActivities /t REG_DWORD /d 0 /f'
    - description: 'Windows がフィードバックを求めないようにする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Siuf\Rules" /v NumberOfSIUFInPeriod /t REG_DWORD /d 0 /f'
    # [検索・プライバシー設定]
    - description: 'Windows SearchでMicrosoftアカウントのクラウドコンテンツ検索を無効化'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsMSACloudSearchEnabled /t REG_DWORD /d 0 /f'
    - description: 'Windows Searchで職場/学校アカウントのクラウドコンテンツ検索を無効化'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsBusinessCloudSearchEnabled /t REG_DWORD /d 0 /f'
    - description: 'Windows SearchでAzure ADアカウントのクラウドコンテンツ検索を無効化'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsAADCloudSearchEnabled /t REG_DWORD /d 0 /f'
    - description: 'デバイス上の検索履歴の保存を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsDeviceSearchHistoryEnabled /t REG_DWORD /d 0 /f'
    - description: '検索ボックスの「検索ハイライト」を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsDynamicSearchBoxEnabled /t REG_DWORD /d 0 /f'
    - description: 'スタートメニューの検索で Web（Bing）の結果を表示しない'
      command: 'reg.exe add "HKCU\Software\Policies\Microsoft\Windows\Explorer" /v DisableSearchBoxSuggestions /t REG_DWORD /d 1 /f'
    # [セキュリティ・電源設定]
    - description: 'コア分離 - メモリ整合性を有効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity" /v Enabled /t REG_DWORD /d 1 /f'
    - description: 'コア分離 - カーネルモードハードウェア強制スタック保護を有効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\KernelShadowStacks" /v Enabled /t REG_DWORD /d 1 /f'
    - description: 'コア分離 - ローカルセキュリティ機関 (LSA) 保護を有効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" /v RunAsPPL /t REG_DWORD /d 1 /f'
    - description: 'Microsoft Defender で望ましくない可能性のあるアプリ（PUA）をブロックする'
      command: 'Set-MpPreference -PUAProtection Enabled'
    - description: '高速スタートアップを無効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power" /v HiberbootEnabled /t REG_DWORD /d 0 /f'
    - description: 'AC電源接続中にPCがスリープしないように設定'
      command: "powercfg.exe /change standby-timeout-ac 0"
    - description: 'バッテリー駆動中にPCがスリープしないように設定'
      command: "powercfg.exe /change standby-timeout-dc 0"
    # [タスクバー・スタートメニュー]
    - description: 'タスクバーの右クリックメニューに「タスクの終了」を表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings" /v TaskbarEndTask /t REG_DWORD /d 1 /f'
    - description: 'スタートのおすすめやジャンプリストに、最近開いた項目を表示しない'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v Start_TrackDocs /t REG_DWORD /d 0 /f'
    # [広告・おすすめの停止]
    - description: '広告 ID を無効にする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo" /v Enabled /t REG_DWORD /d 0 /f'
    - description: 'おすすめのアプリが自動でインストールされないようにする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SilentInstalledAppsEnabled /t REG_DWORD /d 0 /f'
    - description: '設定アプリにおすすめのコンテンツを表示しない（1/3）'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-338393Enabled /t REG_DWORD /d 0 /f'
    - description: '設定アプリにおすすめのコンテンツを表示しない（2/3）'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-353694Enabled /t REG_DWORD /d 0 /f'
    - description: '設定アプリにおすすめのコンテンツを表示しない（3/3）'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-353696Enabled /t REG_DWORD /d 0 /f'
    # [開発者向け]
    - description: '260 文字を超える長いパスを使えるようにする'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f'
    - description: 'Windows PowerShell の実行ポリシーを RemoteSigned にする（今のユーザー）'
      # PowerShell 7 で AutoSetup を動かしても Windows PowerShell（5.1）の設定を変えるよう、powershell.exe を呼ぶ（5.1 と 7 は設定の保存先が別）。
      # AutoSetup は -ExecutionPolicy Bypass で動くため、設定できても「Bypass が優先される」というエラーが出る。成否はエラーではなく、設定後の値で判断する。
      command: 'powershell.exe -NoProfile -Command "try { Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force } catch { }; if ((Get-ExecutionPolicy -Scope CurrentUser) -ne ''RemoteSigned'') { Write-Host ''実行ポリシーを RemoteSigned にできませんでした''; exit 1 }"'
    # [操作・便利機能]
    - description: 'クリップボードの履歴（Windows + V）を有効にする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Clipboard" /v EnableClipboardHistory /t REG_DWORD /d 1 /f'
    - description: 'Shift キーを 5 回押したときの固定キーの確認を表示しない'
      command: 'reg.exe add "HKCU\Control Panel\Accessibility\StickyKeys" /v Flags /t REG_SZ /d 506 /f'

  # --- Winget (基本アプリケーションのインストール) ---
  wingetInstall:
    # [基本アプリ]
    - description: 'PowerShell 7（最新版の PowerShell）'
      id: Microsoft.PowerShell
    - description: 'Google Chrome（定番の Web ブラウザ）'
      id: Google.Chrome
    - description: '7-Zip（高機能なファイル圧縮・解凍ソフト）'
      id: 7zip.7zip
    - description: 'VLC（多機能なメディアプレイヤー）'
      id: VideoLAN.VLC
    - description: 'PowerToys（Windows を便利にする公式ツール群）'
      id: Microsoft.PowerToys
    - description: 'Zoom Workplace（オンライン会議ツール）'
      id: Zoom.Zoom
    - description: 'Adobe Acrobat Reader（PDF 閲覧ソフト）'
      id: Adobe.Acrobat.Reader.64-bit
      options: '--override "/sAll /rs /rps /msi EULA_ACCEPT=YES"'

  # --- Appx (不要なプリインストールアプリの削除) ---
  appxRemove:
    # [基本機能・情報]
    - description: 'AIアシスタント'
      name: "*Cortana*"
    - description: 'ニュース'
      name: "*Microsoft.BingNews*"
    - description: '天気'
      name: "*Microsoft.BingWeather*"
    - description: 'マップ'
      name: "*Microsoft.WindowsMaps*"
    - description: 'ヘルプ'
      name: "*Microsoft.GetHelp*"
    - description: 'ヒント'
      name: "*Microsoft.Getstarted*"
    - description: 'フィードバックHub'
      name: "*Microsoft.WindowsFeedbackHub*"
    - description: 'スマートフォン連携'
      name: "*Microsoft.YourPhone*"
    # [生産性・ユーティリティ]
    - description: 'OneNote (ストアアプリ版)'
      name: "*Microsoft.Office.OneNote*"
    - description: 'メール/カレンダー'
      name: "*microsoft.windowscommunicationsapps*"
    - description: 'People (連絡先)'
      name: "*Microsoft.People*"
    # [エンターテイメント・メディア]
    - description: 'メディア プレーヤー（標準の音楽・動画プレーヤー。VLC で代わりができます）'
      name: "*Microsoft.ZuneMusic*"
    - description: '映画 & テレビ'
      name: "*Microsoft.ZuneVideo*"
    # - description: 'フォト'
    #   name: "*Microsoft.Windows.Photos*"
    # - description: 'ペイント 3D'
    #   name: "*Microsoft.MSPaint*"
    # - description: 'ビデオエディター'
    #   name: "*Clipchamp.Clipchamp*"
    # - description: '複合現実ポータル'
    #   name: "*Microsoft.MixedReality.Portal*"
    # - description: 'ソリティア & カジュアルゲーム'
    #   name: "*Microsoft.MicrosoftSolitaireCollection*"

# ----------------------------------------------------------------
# ■ フェーズ2 開発環境のセットアップ
# ----------------------------------------------------------------
phase2:
  packageManagers: []
</script>

# ----------------------------------------------------------------
# ■ フェーズ2 開発環境のセットアップ
# ----------------------------------------------------------------

phase2:
  packageManagers:
    # --- rustup (ツールチェーン) ---
    - managerName: 'rustup-toolchain'
      checkCommand: "rustup toolchain list | findstr /b /i \"{package}-\""
      installCommand: 'rustup toolchain install {package}'
      packages:
        - description: 'Rust 安定版ツールチェーン'
          name: stable
        - description: 'Rust ナイトリー版ツールチェーン'
          name: nightly
    # --- rustup (コンポーネント / stable) ---
    - managerName: 'rustup-component-stable'
      checkCommand: "rustup component list --installed --toolchain stable | findstr /b /i \"{package}\""
      installCommand: 'rustup component add {package} --toolchain stable'
      packages:
        - description: 'コード整形（rustfmt）'
          name: rustfmt
        - description: '静的解析（clippy）'
          name: clippy
        - description: '標準ライブラリのソース'
          name: rust-src
        - description: 'LLVMツール群（カバレッジ等）'
          name: llvm-tools-preview
    # --- rustup (ターゲット追加 / cross & WASM) ---
    - managerName: 'rustup-target'
      checkCommand: 'rustup target list --installed | findstr /b /i {package}'
      installCommand: 'rustup target add {package}'
      packages:
        - description: 'WASM（ブラウザ系）'
          name: wasm32-unknown-unknown
        - description: 'WASI（サーバサイドWASM）'
          name: wasm32-wasip1
        - description: 'Linux向けクロスビルド'
          name: x86_64-unknown-linux-gnu
        - description: 'macOS向けクロスビルド (Intel Mac)'
          name: x86_64-apple-darwin
        - description: 'macOS向けクロスビルド (Apple Silicon)'
          name: aarch64-apple-darwin
        - description: 'Windows向けクロスビルド (MSVC)'
          name: x86_64-pc-windows-msvc
        - description: 'Windows向けクロスビルド (GNU)'
          name: x86_64-pc-windows-gnu
        - description: 'ARMv7 Linux向けクロスビルド (Raspberry Piなど)'
          name: armv7-unknown-linux-gnueabihf
        - description: 'AArch64 Linux向けクロスビルド (ARMv8, Raspberry Pi 64bitなど)'
          name: aarch64-unknown-linux-gnu
        - description: 'Android ARMv7向けクロスビルド'
          name: armv7-linux-androideabi
        - description: 'Android AArch64向けクロスビルド'
          name: aarch64-linux-android
    # --- cargo (CLIツール / stable) ---
    - managerName: 'cargo-stable'
      checkCommand: "cargo install --list | findstr /b /i /c:\"{package} v\""
      installCommand: 'cargo install --locked {package}'
      packages:
        - description: '依存追加/更新（cargo-edit）'
          name: cargo-edit
        - description: '脆弱性監査（RustSec）'
          name: cargo-audit
        - description: '依存の更新状況'
          name: cargo-outdated
        - description: '高速テストランナー'
          name: cargo-nextest
        - description: 'カバレッジ（llvm-cov統合）'
          name: cargo-llvm-cov
        - description: 'ファイル変更監視・再実行'
          name: cargo-watch
    # --- rustup (コンポーネント / nightly：Miri) ---
    - managerName: 'rustup-component-nightly'
      checkCommand: "rustup component list --installed --toolchain nightly | findstr /b /i \"{package}\""
      installCommand: 'rustup component add {package} --toolchain nightly'
      packages:
        - description: '未定義動作検査 Miri 本体（cargo miri）'
          name: miri
        - description: '標準ライブラリのソース（Miri用）'
          name: rust-src
    # --- cargo (CLIツール / nightly専用) ---
    - managerName: 'cargo-nightly'
      checkCommand: "cargo +nightly install --list | findstr /b /i /c:\"{package} v\""
      installCommand: 'cargo +nightly install --locked {package}'
      packages:
        - description: '未使用依存検出（nightly）'
          name: cargo-udeps

    # --- npm (グローバルNode.jsパッケージ) ---
    - managerName: 'npm'
      checkCommand:  'npm list -g {package}'
      installCommand: 'npm install -g {package}'
      packages:
        # [パッケージマネージャ補助]
        - description: 'Corepack 経由を推奨（pnpmはグローバル導入しない）'
          name: npm
        # [軽量・有用ユーティリティ]
        - description: '依存更新チェッカー（ncu）'
          name: npm-check-updates
        - description: 'クロスプラットフォーム削除（補助的に維持）'
          name: rimraf
        - description: '簡易静的サーバ（用途限定）'
          name: http-server

    - managerName: 'pip'
      checkCommand: 'pip show {package}'
      installCommand: 'uv pip install {package} --system'
      packages:
        # [CLIツール群：どのプロジェクトでも使う]
        - description: 'リンター/フォーマッタ（超高速）'
          name: ruff
        - description: '型チェック'
          name: mypy
        - description: 'テスト実行'
          name: pytest
        - description: 'テストカバレッジ'
          name: coverage
        - description: 'リッチなターミナル出力'
          name: rich
        # Web/DS/MLは各プロジェクトに局所導入（再現性重視）

    # --- go ---
    - managerName: 'go'
      # PATHに<leaf>があればOK（<leaf>は {package} の末尾名。@latest は除去）
      # 別の powershell を起動して "…$cmd…" と書くと、$cmd が先に空へ展開されて、いつも「インストール済み」になるため、同じ PowerShell の中で調べる。
      checkCommand: 'if (-not (Get-Command ((''{package}''.Split(''/'')[-1]).Split(''@'')[0]) -ErrorAction SilentlyContinue)) { throw ''未インストール'' }'
      installCommand: 'go install {package}'
      packages:
        - description: 'Go言語サーバ'
          name: golang.org/x/tools/gopls@latest
        - description: 'import自動整形'
          name: golang.org/x/tools/cmd/goimports@latest
        - description: '厳格整形（gofumpt）'
          name: mvdan.cc/gofumpt@latest
        - description: '静的解析（Staticcheck）'
          name: honnef.co/go/tools/cmd/staticcheck@latest
        - description: '脆弱性検出（公式）'
          name: golang.org/x/vuln/cmd/govulncheck@latest
        - description: '包括的リンター'
          name: github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        - description: 'デバッガ（Delve）'
          name: github.com/go-delve/delve/cmd/dlv@latest
        - description: 'モック生成（uber/mock）'
          name: go.uber.org/mock/mockgen@latest
        - description: 'iota→String 生成'
          name: golang.org/x/tools/cmd/stringer@latest
        - description: 'テストスケルトン生成'
          name: github.com/cweill/gotests/gotests@latest

    # --- ghcup: Haskell コンパイラ (GHC) ---
    - managerName: 'ghcup-ghc'
      checkCommand: 'ghcup whereis ghc {package}'
      installCommand: 'ghcup install ghc {package}'
      packages:
        - description: 'GHC 9.14 系（長期サポート版・最新）'
          name: 9.14.1
        #- description: 'GHC 9.10 系（GHCup のおすすめ版）'
        #  name: 9.10.3

    # --- ghcup: Cabal CLI ---
    - managerName: 'ghcup-cabal'
      checkCommand: 'cabal --version'
      installCommand: 'ghcup install cabal latest'
      packages:
        - description: 'Cabal（公式ビルドシステム）'
          name: latest

    # --- ghcup: Stack CLI ---
    - managerName: 'ghcup-stack'
      # 別の PowerShell を起動せず、同じ PowerShell の中で調べる。5.1 が入っていない将来の Windows でも動くようにするため。
      checkCommand: 'if (-not (Get-Command ''stack'' -ErrorAction SilentlyContinue)) { throw ''未インストール'' }'
      installCommand: 'ghcup install stack latest'
      packages:
        - description: 'Stack（プロジェクト/ビルドツール）'
          name: latest

    # --- ghcup: Haskell Language Server ---
    - managerName: 'ghcup-hls'
      # 別の PowerShell を起動せず、同じ PowerShell の中で調べる。5.1 が入っていない将来の Windows でも動くようにするため。
      checkCommand: 'if (-not (Get-Command ''haskell-language-server-wrapper'' -ErrorAction SilentlyContinue)) { throw ''未インストール'' }'
      installCommand: 'ghcup install hls latest'
      packages:
        - description: 'Haskell Language Server（LSPサポート）'
          name: latest

    # --- cabal: グローバルCLIユーティリティ ---
    - managerName: 'cabal-global'
      # 別の PowerShell を起動せず、同じ PowerShell の中で調べる。5.1 が入っていない将来の Windows でも動くようにするため。
      checkCommand: 'if (-not (Get-Command ''{package}'' -ErrorAction SilentlyContinue)) { throw ''未インストール'' }'
      installCommand: 'cabal update; cabal install --installdir=%APPDATA%\cabal\bin --overwrite-policy=always {package}'
      packages:
        - description: 'コード整形（fourmolu）'
          name: fourmolu
        - description: '静的解析（hlint）'
          name: hlint
        - description: '関数/型検索（hoogle）'
          name: hoogle
        - description: '未使用コード検出（weeder）'
          name: weeder

    - managerName: 'vscode'
      checkCommand: 'code --list-extensions | findstr /i /c:"{package}"'
      installCommand: 'code --install-extension {package}'
      packages:
        # [UI / 表示]
        - description: 'UIの日本語化'
          name: ms-ceintl.vscode-language-pack-ja
        - description: 'インデントを色付け'
          name: oderwat.indent-rainbow
        - description: '全角スペースをハイライト'
          name: mosapride.zenkaku
        - description: 'コメントを種類別に色分け'
          name: aaron-bond.better-comments
        - description: 'エラー/警告を行内表示'
          name: usernamehw.errorlens
        - description: 'EditorConfig（書式統一）'

        - description: '印刷（コード/Markdown をブラウザ経由で印刷・PDF化）'

        - description: 'Markdown編集サポート'
          name: yzhang.markdown-all-in-one
        - description: 'TODOコメントの一覧表示'

        - description: 'ファイルパス入力補完'

        - description: 'dotenvファイル支援'
          name: mikestead.dotenv
        # [コーディング支援（AI）]
        - description: 'AIコード自動生成・チャット（GitHub Copilot）'
          name: GitHub.copilot-chat
        # [バージョン管理 / コラボ / CI]

          name: eamodio.gitlens
        - description: 'Gitブランチツリー可視化'

        # [リモート / コンテナ / Docker]

<script type="text/plain" class="recipe-template" data-name="step2_Go" data-path="template-recipes/step2_Go/recipe.yaml">
# ================================================================
# Windows環境 初期設定自動化スクリプト (AutoSetup) 設定ファイル
# ================================================================
# このファイルは、新しいWindows環境の構築を自動化するためのタスクを定義します。
# 実行したくない項目は、行を削除するか行頭に「#」を付けてコメントアウトしてください。
# ----------------------------------------------------------------
# ■ フェーズ1 OSの基本設定と必須アプリケーションの導入
# ----------------------------------------------------------------
phase1:
  # --- Windowsシステム設定 (レジストリ変更) ---
  windowsSettings:
    # [Windows Update]
    - description: 'Windows Update で、ほかの Microsoft 製品（Office など）も更新する'
      command: '(New-Object -ComObject Microsoft.Update.ServiceManager).AddService2(''7971f918-a847-4430-9279-4a52d1efe18d'', 7, '''') | Out-Null'
    # [エクスプローラー設定]
    - description: 'エクスプローラーで隠しファイルを表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v Hidden /t REG_DWORD /d 1 /f'
    - description: 'エクスプローラーで登録されている拡張子を常に表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v HideFileExt /t REG_DWORD /d 0 /f'
    - description: 'アドレスバーに常に完全なパスを表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\CabinetState" /v FullPathAddress /t REG_DWORD /d 1 /f'
    - description: 'エクスプローラー起動時のデフォルト表示を「PC」にする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v LaunchTo /t REG_DWORD /d 1 /f'
    - description: 'エクスプローラーの「ホーム」に最近使ったファイルを表示しない'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer" /v ShowRecent /t REG_DWORD /d 0 /f'
    - description: 'エクスプローラーの「ホーム」によく使うフォルダーを表示しない'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer" /v ShowFrequent /t REG_DWORD /d 0 /f'
    # [自動再生設定]
    - description: '全てのメディアとデバイスで自動再生機能を有効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers" /v DisableAutoplay /t REG_DWORD /d 0 /f'
    - description: 'リムーバブルドライブ接続時、フォルダーを開いてファイルを表示する'

      # PowerShell 7 で AutoSetup を動かしても Windows PowerShell（5.1）の設定を変えるよう、powershell.exe を呼ぶ（5.1 と 7 は設定の保存先が別）。

# ■ フェーズ2 開発環境のセットアップ
# ----------------------------------------------------------------
phase2:
  packageManagers:
    # --- go ---
    - managerName: 'go'
      # PATHに<leaf>があればOK（<leaf>は {package} の末尾名。@latest は除去）
      # 別の powershell を起動して "…$cmd…" と書くと、$cmd が先に空へ展開されて、いつも「インストール済み」になるため、同じ PowerShell の中で調べる。
      checkCommand: 'if (-not (Get-Command ((''{package}''.Split(''/'')[-1]).Split(''@'')[0]) -ErrorAction SilentlyContinue)) { throw ''未インストール'' }'
      installCommand: 'go install {package}'
      packages:
        - description: 'Go言語サーバ'
          name: golang.org/x/tools/gopls@latest
        - description: 'import自動整形'
          name: golang.org/x/tools/cmd/goimports@latest
        - description: '厳格整形（gofumpt）'
          name: mvdan.cc/gofumpt@latest
        - description: '静的解析（Staticcheck）'
          name: honnef.co/go/tools/cmd/staticcheck@latest
        - description: '脆弱性検出（公式）'
          name: golang.org/x/vuln/cmd/govulncheck@latest
        - description: '包括的リンター'
          name: github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        - description: 'デバッガ（Delve）'
          name: github.com/go-delve/delve/cmd/dlv@latest
        - description: 'モック生成（uber/mock）'
          name: go.uber.org/mock/mockgen@latest
        - description: 'iota→String 生成'
          name: golang.org/x/tools/cmd/stringer@latest
        - description: 'テストスケルトン生成'
          name: github.com/cweill/gotests/gotests@latest

    # --- PowerShell モジュール（PowerShell Gallery） ---
    - managerName: 'psgallery'
      # Windows PowerShell 5.1 は非推奨のため、フェーズ1で入る PowerShell 7 にモジュールを入れる。AutoSetup が 5.1 で動いていても 7 に入るよう、pwsh を呼ぶ。
      checkCommand: 'pwsh -NoProfile -Command "if (-not (Get-Module -ListAvailable -Name ''{package}'')) { exit 1 }"'
      installCommand: 'pwsh -NoProfile -Command "Install-Module -Name ''{package}'' -Scope AllUsers -Repository PSGallery -Force -ErrorAction Stop"'
      packages:
        - description: 'PowerShell の書き方チェック（PSScriptAnalyzer）'
          name: PSScriptAnalyzer
</script>

    - description: '検索ボックスの「検索ハイライト」を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsDynamicSearchBoxEnabled /t REG_DWORD /d 0 /f'
    - description: 'スタートメニューの検索で Web（Bing）の結果を表示しない'
      command: 'reg.exe add "HKCU\Software\Policies\Microsoft\Windows\Explorer" /v DisableSearchBoxSuggestions /t REG_DWORD /d 1 /f'
    # [セキュリティ・電源設定]
    - description: 'コア分離 - メモリ整合性を有効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity" /v Enabled /t REG_DWORD /d 1 /f'
    - description: 'コア分離 - カーネルモードハードウェア強制スタック保護を有効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\KernelShadowStacks" /v Enabled /t REG_DWORD /d 1 /f'
    - description: 'コア分離 - ローカルセキュリティ機関 (LSA) 保護を有効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" /v RunAsPPL /t REG_DWORD /d 1 /f'
    - description: 'Microsoft Defender で望ましくない可能性のあるアプリ（PUA）をブロックする'
      command: 'Set-MpPreference -PUAProtection Enabled'
    - description: '高速スタートアップを無効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power" /v HiberbootEnabled /t REG_DWORD /d 0 /f'
    - description: 'AC電源接続中にPCがスリープしないように設定'
      command: "powercfg.exe /change standby-timeout-ac 0"
    - description: 'バッテリー駆動中にPCがスリープしないように設定'
      command: "powercfg.exe /change standby-timeout-dc 0"
    # [タスクバー・スタートメニュー]
    - description: 'タスクバーの右クリックメニューに「タスクの終了」を表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings" /v TaskbarEndTask /t REG_DWORD /d 1 /f'
    - description: 'スタートのおすすめやジャンプリストに、最近開いた項目を表示しない'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v Start_TrackDocs /t REG_DWORD /d 0 /f'
    # [広告・おすすめの停止]
    - description: '広告 ID を無効にする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo" /v Enabled /t REG_DWORD /d 0 /f'
    - description: 'おすすめのアプリが自動でインストールされないようにする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SilentInstalledAppsEnabled /t REG_DWORD /d 0 /f'
    - description: '設定アプリにおすすめのコンテンツを表示しない（1/3）'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-338393Enabled /t REG_DWORD /d 0 /f'
    - description: '設定アプリにおすすめのコンテンツを表示しない（2/3）'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-353694Enabled /t REG_DWORD /d 0 /f'
    - description: '設定アプリにおすすめのコンテンツを表示しない（3/3）'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-353696Enabled /t REG_DWORD /d 0 /f'
    # [開発者向け]
    - description: '260 文字を超える長いパスを使えるようにする'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f'
    - description: 'Windows PowerShell の実行ポリシーを RemoteSigned にする（今のユーザー）'
      # PowerShell 7 で AutoSetup を動かしても Windows PowerShell（5.1）の設定を変えるよう、powershell.exe を呼ぶ（5.1 と 7 は設定の保存先が別）。
      # AutoSetup は -ExecutionPolicy Bypass で動くため、設定できても「Bypass が優先される」というエラーが出る。成否はエラーではなく、設定後の値で判断する。
      command: 'powershell.exe -NoProfile -Command "try { Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force } catch { }; if ((Get-ExecutionPolicy -Scope CurrentUser) -ne ''RemoteSigned'') { Write-Host ''実行ポリシーを RemoteSigned にできませんでした''; exit 1 }"'
    # [操作・便利機能]
    - description: 'クリップボードの履歴（Windows + V）を有効にする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Clipboard" /v EnableClipboardHistory /t REG_DWORD /d 1 /f'
    - description: 'Shift キーを 5 回押したときの固定キーの確認を表示しない'
      command: 'reg.exe add "HKCU\Control Panel\Accessibility\StickyKeys" /v Flags /t REG_SZ /d 506 /f'
    # [開発環境の準備]
    - description: 'Haskell ツールチェーン (GHCup) を公式スクリプトでインストール'
      command: '$env:BOOTSTRAP_HASKELL_NONINTERACTIVE=1; Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString(''https://www.haskell.org/ghcup/sh/bootstrap-haskell.ps1''))'

# ----------------------------------------------------------------
# ■ フェーズ2 開発環境のセットアップ
# ----------------------------------------------------------------
phase2:
  packageManagers:
    # --- ghcup: Haskell コンパイラ (GHC) ---
    - managerName: 'ghcup-ghc'
      checkCommand: 'ghcup whereis ghc {package}'
      installCommand: 'ghcup install ghc {package}'
      packages:
        - description: 'GHC 9.14 系（長期サポート版・最新）'
          name: 9.14.1
        #- description: 'GHC 9.10 系（GHCup のおすすめ版）'
        #  name: 9.10.3

    # --- ghcup: Cabal CLI ---
    - managerName: 'ghcup-cabal'
      checkCommand: 'cabal --version'
      installCommand: 'ghcup install cabal latest'
      packages:
        - description: 'Cabal（公式ビルドシステム）'
          name: latest

    # --- ghcup: Stack CLI ---
    - managerName: 'ghcup-stack'
      # 別の PowerShell を起動せず、同じ PowerShell の中で調べる。5.1 が入っていない将来の Windows でも動くようにするため。
      checkCommand: 'if (-not (Get-Command ''stack'' -ErrorAction SilentlyContinue)) { throw ''未インストール'' }'
      installCommand: 'ghcup install stack latest'
      packages:
        - description: 'Stack（プロジェクト/ビルドツール）'
          name: latest

    # --- ghcup: Haskell Language Server ---
    - managerName: 'ghcup-hls'
      # 別の PowerShell を起動せず、同じ PowerShell の中で調べる。5.1 が入っていない将来の Windows でも動くようにするため。
      checkCommand: 'if (-not (Get-Command ''haskell-language-server-wrapper'' -ErrorAction SilentlyContinue)) { throw ''未インストール'' }'
      installCommand: 'ghcup install hls latest'
      packages:
        - description: 'Haskell Language Server（LSPサポート）'
          name: latest

    # --- cabal: グローバルCLIユーティリティ ---
    - managerName: 'cabal-global'
      # 別の PowerShell を起動せず、同じ PowerShell の中で調べる。5.1 が入っていない将来の Windows でも動くようにするため。
      checkCommand: 'if (-not (Get-Command ''{package}'' -ErrorAction SilentlyContinue)) { throw ''未インストール'' }'
      installCommand: 'cabal update; cabal install --installdir=%APPDATA%\cabal\bin --overwrite-policy=always {package}'
      packages:
        - description: 'コード整形（fourmolu）'
          name: fourmolu
        - description: '静的解析（hlint）'
          name: hlint
        - description: '関数/型検索（hoogle）'
          name: hoogle
        - description: '未使用コード検出（weeder）'
          name: weeder

    # --- PowerShell モジュール（PowerShell Gallery） ---
    - managerName: 'psgallery'
      # Windows PowerShell 5.1 は非推奨のため、フェーズ1で入る PowerShell 7 にモジュールを入れる。AutoSetup が 5.1 で動いていても 7 に入るよう、pwsh を呼ぶ。
      checkCommand: 'pwsh -NoProfile -Command "if (-not (Get-Module -ListAvailable -Name ''{package}'')) { exit 1 }"'
      installCommand: 'pwsh -NoProfile -Command "Install-Module -Name ''{package}'' -Scope AllUsers -Repository PSGallery -Force -ErrorAction Stop"'
      packages:
        - description: 'PowerShell の書き方チェック（PSScriptAnalyzer）'
          name: PSScriptAnalyzer
</script>

# ================================================================

      command: '(New-Object -ComObject Microsoft.Update.ServiceManager).AddService2(''7971f918-a847-4430-9279-4a52d1efe18d'', 7, '''') | Out-Null'

    - description: 'アドレスバーに常に完全なパスを表示する'

phase2:

      checkCommand:  'npm list -g {package}'
      installCommand: 'npm install -g {package}'
      packages:

        - description: 'Corepack 経由を推奨（pnpmはグローバル導入しない）'
          name: npm
        # [軽量・有用ユーティリティ]

          name: npm-check-updates

          name: rimraf
        - description: '簡易静的サーバ（用途限定）'
          name: http-server

    # --- PowerShell モジュール（PowerShell Gallery） ---
    - managerName: 'psgallery'
      # Windows PowerShell 5.1 は非推奨のため、フェーズ1で入る PowerShell 7 にモジュールを入れる。AutoSetup が 5.1 で動いていても 7 に入るよう、pwsh を呼ぶ。
      checkCommand: 'pwsh -NoProfile -Command "if (-not (Get-Module -ListAvailable -Name ''{package}'')) { exit 1 }"'
      installCommand: 'pwsh -NoProfile -Command "Install-Module -Name ''{package}'' -Scope AllUsers -Repository PSGallery -Force -ErrorAction Stop"'
      packages:
        - description: 'PowerShell の書き方チェック（PSScriptAnalyzer）'
          name: PSScriptAnalyzer

phase2:

      checkCommand: 'pip show {package}'
      installCommand: 'uv pip install {package} --system'
      packages:

        - description: 'リンター/フォーマッタ（超高速）'
          name: ruff

          name: mypy

          name: pytest
        - description: 'テストカバレッジ'
          name: coverage
        - description: 'リッチなターミナル出力'
          name: rich
        # Web/DS/MLは各プロジェクトに局所導入（再現性重視）

    # --- PowerShell モジュール（PowerShell Gallery） ---
    - managerName: 'psgallery'
      # Windows PowerShell 5.1 は非推奨のため、フェーズ1で入る PowerShell 7 にモジュールを入れる。AutoSetup が 5.1 で動いていても 7 に入るよう、pwsh を呼ぶ。
      checkCommand: 'pwsh -NoProfile -Command "if (-not (Get-Module -ListAvailable -Name ''{package}'')) { exit 1 }"'
      installCommand: 'pwsh -NoProfile -Command "Install-Module -Name ''{package}'' -Scope AllUsers -Repository PSGallery -Force -ErrorAction Stop"'
      packages:
        - description: 'PowerShell の書き方チェック（PSScriptAnalyzer）'
          name: PSScriptAnalyzer

# ================================================================
# Windows環境 初期設定自動化スクリプト (AutoSetup) 設定ファイル
# ================================================================
# このファイルは、新しいWindows環境の構築を自動化するためのタスクを定義します。
# 実行したくない項目は、行を削除するか行頭に「#」を付けてコメントアウトしてください。
# ----------------------------------------------------------------
# ■ フェーズ1 OSの基本設定と必須アプリケーションの導入
# ----------------------------------------------------------------
phase1:
  # --- Windowsシステム設定 (レジストリ変更) ---
  windowsSettings:
    # [Windows Update]
    - description: 'Windows Update で、ほかの Microsoft 製品（Office など）も更新する'
      command: '(New-Object -ComObject Microsoft.Update.ServiceManager).AddService2(''7971f918-a847-4430-9279-4a52d1efe18d'', 7, '''') | Out-Null'
    # [エクスプローラー設定]
    - description: 'エクスプローラーで隠しファイルを表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v Hidden /t REG_DWORD /d 1 /f'
    - description: 'エクスプローラーで登録されている拡張子を常に表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v HideFileExt /t REG_DWORD /d 0 /f'
    - description: 'アドレスバーに常に完全なパスを表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\CabinetState" /v FullPathAddress /t REG_DWORD /d 1 /f'
    - description: 'エクスプローラー起動時のデフォルト表示を「PC」にする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v LaunchTo /t REG_DWORD /d 1 /f'
    - description: 'エクスプローラーの「ホーム」に最近使ったファイルを表示しない'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer" /v ShowRecent /t REG_DWORD /d 0 /f'
    - description: 'エクスプローラーの「ホーム」によく使うフォルダーを表示しない'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer" /v ShowFrequent /t REG_DWORD /d 0 /f'
    # [自動再生設定]
    - description: '全てのメディアとデバイスで自動再生機能を有効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers" /v DisableAutoplay /t REG_DWORD /d 0 /f'
    - description: 'リムーバブルドライブ接続時、フォルダーを開いてファイルを表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers\UserChosenExecuteHandlers\StorageOnArrival" /ve /t REG_SZ /d "MSOpenFolder" /f'
    # [通知・プライバシー設定]
    - description: 'サインイン時の「ようこそ」画面やヒント表示を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-310093Enabled /t REG_DWORD /d 0 /f'
    - description: 'デバイス設定の完了を促す通知を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\UserProfileEngagement" /v ScoobeSystemSettingEnabled /t REG_DWORD /d 0 /f'
    - description: 'Windowsの使用に関するヒントや提案の通知を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-338389Enabled /t REG_DWORD /d 0 /f'
    - description: 'OSの診断データを必須なものに限定する'
      command: 'reg.exe add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection" /v AllowTelemetry /t REG_DWORD /d 1 /f'
    - description: '手書き・キーボード入力の履歴がMicrosoftに送信されるのを防ぐ'
      command: 'reg.exe add "HKCU\Software\Microsoft\Input\TIPC" /v Enabled /t REG_DWORD /d 0 /f'
    - description: '診断データに基づいた個人向けのおすすめ機能などを無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Privacy" /v TailoredExperiencesWithDiagnosticDataEnabled /t REG_DWORD /d 0 /f'
    - description: 'アクティビティの履歴を記録しない'
      command: 'reg.exe add "HKLM\SOFTWARE\Policies\Microsoft\Windows\System" /v PublishUserActivities /t REG_DWORD /d 0 /f'
    - description: 'アクティビティの履歴を Microsoft に送らない'
      command: 'reg.exe add "HKLM\SOFTWARE\Policies\Microsoft\Windows\System" /v UploadUserActivities /t REG_DWORD /d 0 /f'
    - description: 'Windows がフィードバックを求めないようにする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Siuf\Rules" /v NumberOfSIUFInPeriod /t REG_DWORD /d 0 /f'
    # [検索・プライバシー設定]
    - description: 'Windows SearchでMicrosoftアカウントのクラウドコンテンツ検索を無効化'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsMSACloudSearchEnabled /t REG_DWORD /d 0 /f'
    - description: 'Windows Searchで職場/学校アカウントのクラウドコンテンツ検索を無効化'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsBusinessCloudSearchEnabled /t REG_DWORD /d 0 /f'
    - description: 'Windows SearchでAzure ADアカウントのクラウドコンテンツ検索を無効化'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsAADCloudSearchEnabled /t REG_DWORD /d 0 /f'
    - description: 'デバイス上の検索履歴の保存を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsDeviceSearchHistoryEnabled /t REG_DWORD /d 0 /f'
    - description: '検索ボックスの「検索ハイライト」を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsDynamicSearchBoxEnabled /t REG_DWORD /d 0 /f'
    - description: 'スタートメニューの検索で Web（Bing）の結果を表示しない'
      command: 'reg.exe add "HKCU\Software\Policies\Microsoft\Windows\Explorer" /v DisableSearchBoxSuggestions /t REG_DWORD /d 1 /f'
    # [セキュリティ・電源設定]
    - description: 'コア分離 - メモリ整合性を有効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity" /v Enabled /t REG_DWORD /d 1 /f'
    - description: 'コア分離 - カーネルモードハードウェア強制スタック保護を有効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\KernelShadowStacks" /v Enabled /t REG_DWORD /d 1 /f'
    - description: 'コア分離 - ローカルセキュリティ機関 (LSA) 保護を有効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" /v RunAsPPL /t REG_DWORD /d 1 /f'
    - description: 'Microsoft Defender で望ましくない可能性のあるアプリ（PUA）をブロックする'
      command: 'Set-MpPreference -PUAProtection Enabled'
    - description: '高速スタートアップを無効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power" /v HiberbootEnabled /t REG_DWORD /d 0 /f'
    - description: 'AC電源接続中にPCがスリープしないように設定'
      command: "powercfg.exe /change standby-timeout-ac 0"
    - description: 'バッテリー駆動中にPCがスリープしないように設定'
      command: "powercfg.exe /change standby-timeout-dc 0"
    # [タスクバー・スタートメニュー]
    - description: 'タスクバーの右クリックメニューに「タスクの終了」を表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings" /v TaskbarEndTask /t REG_DWORD /d 1 /f'
    - description: 'スタートのおすすめやジャンプリストに、最近開いた項目を表示しない'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v Start_TrackDocs /t REG_DWORD /d 0 /f'
    # [広告・おすすめの停止]
    - description: '広告 ID を無効にする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo" /v Enabled /t REG_DWORD /d 0 /f'
    - description: 'おすすめのアプリが自動でインストールされないようにする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SilentInstalledAppsEnabled /t REG_DWORD /d 0 /f'
    - description: '設定アプリにおすすめのコンテンツを表示しない（1/3）'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-338393Enabled /t REG_DWORD /d 0 /f'
    - description: '設定アプリにおすすめのコンテンツを表示しない（2/3）'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-353694Enabled /t REG_DWORD /d 0 /f'
    - description: '設定アプリにおすすめのコンテンツを表示しない（3/3）'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-353696Enabled /t REG_DWORD /d 0 /f'
    # [開発者向け]
    - description: '260 文字を超える長いパスを使えるようにする'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f'
    - description: 'Windows PowerShell の実行ポリシーを RemoteSigned にする（今のユーザー）'
      # PowerShell 7 で AutoSetup を動かしても Windows PowerShell（5.1）の設定を変えるよう、powershell.exe を呼ぶ（5.1 と 7 は設定の保存先が別）。
      # AutoSetup は -ExecutionPolicy Bypass で動くため、設定できても「Bypass が優先される」というエラーが出る。成否はエラーではなく、設定後の値で判断する。
      command: 'powershell.exe -NoProfile -Command "try { Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force } catch { }; if ((Get-ExecutionPolicy -Scope CurrentUser) -ne ''RemoteSigned'') { Write-Host ''実行ポリシーを RemoteSigned にできませんでした''; exit 1 }"'
    # [操作・便利機能]
    - description: 'クリップボードの履歴（Windows + V）を有効にする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Clipboard" /v EnableClipboardHistory /t REG_DWORD /d 1 /f'
    - description: 'Shift キーを 5 回押したときの固定キーの確認を表示しない'
      command: 'reg.exe add "HKCU\Control Panel\Accessibility\StickyKeys" /v Flags /t REG_SZ /d 506 /f'

# ----------------------------------------------------------------
# ■ フェーズ2 開発環境のセットアップ
# ----------------------------------------------------------------
phase2:
  packageManagers:
  # --- rustup (ツールチェーン) ---
  - managerName: 'rustup-toolchain'
    checkCommand: "rustup toolchain list | findstr /b /i \"{package}-\""
    installCommand: 'rustup toolchain install {package}'
    packages:
      - description: 'Rust 安定版ツールチェーン'
        name: stable
      - description: 'Rust ナイトリー版ツールチェーン'
        name: nightly
  # --- rustup (コンポーネント / stable) ---
  - managerName: 'rustup-component-stable'
    checkCommand: "rustup component list --installed --toolchain stable | findstr /b /i \"{package}\""
    installCommand: 'rustup component add {package} --toolchain stable'
    packages:
      - description: 'コード整形（rustfmt）'
        name: rustfmt
      - description: '静的解析（clippy）'
        name: clippy
      - description: '標準ライブラリのソース'
        name: rust-src
      - description: 'LLVMツール群（カバレッジ等）'
        name: llvm-tools-preview
  # --- rustup (ターゲット追加 / cross & WASM) ---
  - managerName: 'rustup-target'
    checkCommand: 'rustup target list --installed | findstr /b /i {package}'
    installCommand: 'rustup target add {package}'
    packages:
      - description: 'WASM（ブラウザ系）'
        name: wasm32-unknown-unknown
      - description: 'WASI（サーバサイドWASM）'
        name: wasm32-wasip1
      - description: 'Linux向けクロスビルド'
        name: x86_64-unknown-linux-gnu
      - description: 'macOS向けクロスビルド (Intel Mac)'
        name: x86_64-apple-darwin
      - description: 'macOS向けクロスビルド (Apple Silicon)'
        name: aarch64-apple-darwin
      - description: 'Windows向けクロスビルド (MSVC)'
        name: x86_64-pc-windows-msvc
      - description: 'Windows向けクロスビルド (GNU)'
        name: x86_64-pc-windows-gnu
      - description: 'ARMv7 Linux向けクロスビルド (Raspberry Piなど)'
        name: armv7-unknown-linux-gnueabihf
      - description: 'AArch64 Linux向けクロスビルド (ARMv8, Raspberry Pi 64bitなど)'
        name: aarch64-unknown-linux-gnu
      - description: 'Android ARMv7向けクロスビルド'
        name: armv7-linux-androideabi
      - description: 'Android AArch64向けクロスビルド'
        name: aarch64-linux-android
  # --- cargo (CLIツール / stable) ---
  - managerName: 'cargo-stable'
    checkCommand: "cargo install --list | findstr /b /i /c:\"{package} v\""
    installCommand: 'cargo install --locked {package}'
    packages:
      - description: '依存追加/更新（cargo-edit）'
        name: cargo-edit
      - description: '脆弱性監査（RustSec）'
        name: cargo-audit
      - description: '依存の更新状況'
        name: cargo-outdated
      - description: '高速テストランナー'
        name: cargo-nextest
      - description: 'カバレッジ（llvm-cov統合）'
        name: cargo-llvm-cov
      - description: 'ファイル変更監視・再実行'
        name: cargo-watch
  # --- rustup (コンポーネント / nightly：Miri) ---
  - managerName: 'rustup-component-nightly'
    checkCommand: "rustup component list --installed --toolchain nightly | findstr /b /i \"{package}\""
    installCommand: 'rustup component add {package} --toolchain nightly'
    packages:
      - description: '未定義動作検査 Miri 本体（cargo miri）'
        name: miri
      - description: '標準ライブラリのソース（Miri用）'
        name: rust-src
  # --- cargo (CLIツール / nightly専用) ---
  - managerName: 'cargo-nightly'
    checkCommand: "cargo +nightly install --list | findstr /b /i /c:\"{package} v\""
    installCommand: 'cargo +nightly install --locked {package}'
    packages:
      - description: '未使用依存検出（nightly）'
        name: cargo-udeps

  # --- PowerShell モジュール（PowerShell Gallery） ---
  - managerName: 'psgallery'
    # Windows PowerShell 5.1 は非推奨のため、フェーズ1で入る PowerShell 7 にモジュールを入れる。AutoSetup が 5.1 で動いていても 7 に入るよう、pwsh を呼ぶ。
    checkCommand: 'pwsh -NoProfile -Command "if (-not (Get-Module -ListAvailable -Name ''{package}'')) { exit 1 }"'
    installCommand: 'pwsh -NoProfile -Command "Install-Module -Name ''{package}'' -Scope AllUsers -Repository PSGallery -Force -ErrorAction Stop"'
    packages:
      - description: 'PowerShell の書き方チェック（PSScriptAnalyzer）'
        name: PSScriptAnalyzer
</script>
<script type="text/plain" class="recipe-template" data-name="step2_VSCode" data-path="template-recipes/step2_VSCode/recipe.yaml">
# ================================================================
# Windows環境 初期設定自動化スクリプト (AutoSetup) 設定ファイル
# ================================================================
# このファイルは、新しいWindows環境の構築を自動化するためのタスクを定義します。
# 実行したくない項目は、行を削除するか行頭に「#」を付けてコメントアウトしてください。
# ----------------------------------------------------------------
# ■ フェーズ1 OSの基本設定と必須アプリケーションの導入
# ----------------------------------------------------------------
phase1:
  # --- Windowsシステム設定 (レジストリ変更) ---
  windowsSettings:
    # [Windows Update]
    - description: 'Windows Update で、ほかの Microsoft 製品（Office など）も更新する'
      command: '(New-Object -ComObject Microsoft.Update.ServiceManager).AddService2(''7971f918-a847-4430-9279-4a52d1efe18d'', 7, '''') | Out-Null'
    # [エクスプローラー設定]
    - description: 'エクスプローラーで隠しファイルを表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v Hidden /t REG_DWORD /d 1 /f'
    - description: 'エクスプローラーで登録されている拡張子を常に表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v HideFileExt /t REG_DWORD /d 0 /f'
    - description: 'アドレスバーに常に完全なパスを表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\CabinetState" /v FullPathAddress /t REG_DWORD /d 1 /f'
    - description: 'エクスプローラー起動時のデフォルト表示を「PC」にする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v LaunchTo /t REG_DWORD /d 1 /f'
    - description: 'エクスプローラーの「ホーム」に最近使ったファイルを表示しない'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer" /v ShowRecent /t REG_DWORD /d 0 /f'
    - description: 'エクスプローラーの「ホーム」によく使うフォルダーを表示しない'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer" /v ShowFrequent /t REG_DWORD /d 0 /f'
    # [自動再生設定]
    - description: '全てのメディアとデバイスで自動再生機能を有効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers" /v DisableAutoplay /t REG_DWORD /d 0 /f'
    - description: 'リムーバブルドライブ接続時、フォルダーを開いてファイルを表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers\UserChosenExecuteHandlers\StorageOnArrival" /ve /t REG_SZ /d "MSOpenFolder" /f'
    # [通知・プライバシー設定]
    - description: 'サインイン時の「ようこそ」画面やヒント表示を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-310093Enabled /t REG_DWORD /d 0 /f'
    - description: 'デバイス設定の完了を促す通知を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\UserProfileEngagement" /v ScoobeSystemSettingEnabled /t REG_DWORD /d 0 /f'
    - description: 'Windowsの使用に関するヒントや提案の通知を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-338389Enabled /t REG_DWORD /d 0 /f'
    - description: 'OSの診断データを必須なものに限定する'
      command: 'reg.exe add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection" /v AllowTelemetry /t REG_DWORD /d 1 /f'
    - description: '手書き・キーボード入力の履歴がMicrosoftに送信されるのを防ぐ'
      command: 'reg.exe add "HKCU\Software\Microsoft\Input\TIPC" /v Enabled /t REG_DWORD /d 0 /f'
    - description: '診断データに基づいた個人向けのおすすめ機能などを無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Privacy" /v TailoredExperiencesWithDiagnosticDataEnabled /t REG_DWORD /d 0 /f'
    - description: 'アクティビティの履歴を記録しない'
      command: 'reg.exe add "HKLM\SOFTWARE\Policies\Microsoft\Windows\System" /v PublishUserActivities /t REG_DWORD /d 0 /f'
    - description: 'アクティビティの履歴を Microsoft に送らない'
      command: 'reg.exe add "HKLM\SOFTWARE\Policies\Microsoft\Windows\System" /v UploadUserActivities /t REG_DWORD /d 0 /f'
    - description: 'Windows がフィードバックを求めないようにする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Siuf\Rules" /v NumberOfSIUFInPeriod /t REG_DWORD /d 0 /f'
    # [検索・プライバシー設定]
    - description: 'Windows SearchでMicrosoftアカウントのクラウドコンテンツ検索を無効化'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsMSACloudSearchEnabled /t REG_DWORD /d 0 /f'
    - description: 'Windows Searchで職場/学校アカウントのクラウドコンテンツ検索を無効化'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsBusinessCloudSearchEnabled /t REG_DWORD /d 0 /f'
    - description: 'Windows SearchでAzure ADアカウントのクラウドコンテンツ検索を無効化'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsAADCloudSearchEnabled /t REG_DWORD /d 0 /f'
    - description: 'デバイス上の検索履歴の保存を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsDeviceSearchHistoryEnabled /t REG_DWORD /d 0 /f'
    - description: '検索ボックスの「検索ハイライト」を無効化する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings" /v IsDynamicSearchBoxEnabled /t REG_DWORD /d 0 /f'
    - description: 'スタートメニューの検索で Web（Bing）の結果を表示しない'
      command: 'reg.exe add "HKCU\Software\Policies\Microsoft\Windows\Explorer" /v DisableSearchBoxSuggestions /t REG_DWORD /d 1 /f'
    # [セキュリティ・電源設定]
    - description: 'コア分離 - メモリ整合性を有効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity" /v Enabled /t REG_DWORD /d 1 /f'
    - description: 'コア分離 - カーネルモードハードウェア強制スタック保護を有効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\KernelShadowStacks" /v Enabled /t REG_DWORD /d 1 /f'
    - description: 'コア分離 - ローカルセキュリティ機関 (LSA) 保護を有効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" /v RunAsPPL /t REG_DWORD /d 1 /f'
    - description: 'Microsoft Defender で望ましくない可能性のあるアプリ（PUA）をブロックする'
      command: 'Set-MpPreference -PUAProtection Enabled'
    - description: '高速スタートアップを無効化'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power" /v HiberbootEnabled /t REG_DWORD /d 0 /f'
    - description: 'AC電源接続中にPCがスリープしないように設定'
      command: "powercfg.exe /change standby-timeout-ac 0"
    - description: 'バッテリー駆動中にPCがスリープしないように設定'
      command: "powercfg.exe /change standby-timeout-dc 0"
    # [タスクバー・スタートメニュー]
    - description: 'タスクバーの右クリックメニューに「タスクの終了」を表示する'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings" /v TaskbarEndTask /t REG_DWORD /d 1 /f'
    - description: 'スタートのおすすめやジャンプリストに、最近開いた項目を表示しない'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v Start_TrackDocs /t REG_DWORD /d 0 /f'
    # [広告・おすすめの停止]
    - description: '広告 ID を無効にする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo" /v Enabled /t REG_DWORD /d 0 /f'
    - description: 'おすすめのアプリが自動でインストールされないようにする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SilentInstalledAppsEnabled /t REG_DWORD /d 0 /f'
    - description: '設定アプリにおすすめのコンテンツを表示しない（1/3）'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-338393Enabled /t REG_DWORD /d 0 /f'
    - description: '設定アプリにおすすめのコンテンツを表示しない（2/3）'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-353694Enabled /t REG_DWORD /d 0 /f'
    - description: '設定アプリにおすすめのコンテンツを表示しない（3/3）'
      command: 'reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-353696Enabled /t REG_DWORD /d 0 /f'
    # [開発者向け]
    - description: '260 文字を超える長いパスを使えるようにする'
      command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f'
    - description: 'Windows PowerShell の実行ポリシーを RemoteSigned にする（今のユーザー）'
      # PowerShell 7 で AutoSetup を動かしても Windows PowerShell（5.1）の設定を変えるよう、powershell.exe を呼ぶ（5.1 と 7 は設定の保存先が別）。
      # AutoSetup は -ExecutionPolicy Bypass で動くため、設定できても「Bypass が優先される」というエラーが出る。成否はエラーではなく、設定後の値で判断する。
      command: 'powershell.exe -NoProfile -Command "try { Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force } catch { }; if ((Get-ExecutionPolicy -Scope CurrentUser) -ne ''RemoteSigned'') { Write-Host ''実行ポリシーを RemoteSigned にできませんでした''; exit 1 }"'
    # [操作・便利機能]
    - description: 'クリップボードの履歴（Windows + V）を有効にする'
      command: 'reg.exe add "HKCU\Software\Microsoft\Clipboard" /v EnableClipboardHistory /t REG_DWORD /d 1 /f'
    - description: 'Shift キーを 5 回押したときの固定キーの確認を表示しない'
      command: 'reg.exe add "HKCU\Control Panel\Accessibility\StickyKeys" /v Flags /t REG_SZ /d 506 /f'

(() => {
  const root = document.documentElement;
  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  const osDark = window.matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : osDark.matches;
  const render = () => {
    const dark = isDark();
    root.classList.toggle('is-dark', dark);
    label.textContent = dark ? 'ライト' : 'ダーク';
    toggle.title = dark ? 'ライトモードに切り替える' : 'ダークモードに切り替える';
  };
  toggle.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('recipe-builder-theme', next); } catch (e) { /* 保存できなくても、今の画面は切り替わる */ }
    render();
  });
  osDark.addEventListener('change', render);

})();
